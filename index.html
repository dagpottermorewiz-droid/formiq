<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Formiq</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Home-screen install: these only bite when the file is served top-level (own host or local file), not inside the artifact viewer. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Formiq">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F6F1E4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141815" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

</head>
<body>
<style>
/* Layout: one 760px column &#8212; sticky header with streak, tab pills, stacked cards; bottom-safe action bar for live workouts. */
:root{
  --bg:#F6F1E4; --surface:#FDFAF2; --surface-2:#EDE6D5; --surface-3:#E2D9C4;
  --line:#D6CCB5; --line-soft:#E8E1D0;
  --fg:#1C201C; --fg-dim:#525C4E; --fg-faint:#7C8475;
  --accent:#2D6A4F; --accent-soft:#DCE8DC; --accent-ink:#1B4332;
  --ember:#A9541F; --ember-soft:#F4E2D1;
  --danger:#9E2B20; --soon:#80600F;
  --on-accent:#FDFAF2; --on-ember:#FDFAF2; --on-danger:#FDFAF2; --on-soon:#FDFAF2;
  --k-health:#2D6A4F; --k-class:#35607F; --k-study:#A9541F; --k-project:#5B4A7A; --k-meal:#80600F; --k-rest:#525C4E;
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141815; --surface:#1C211D; --surface-2:#262C27; --surface-3:#323A33;
  --line:#3A433B; --line-soft:#2A312B;
  --fg:#F2EDE0; --fg-dim:#A5AC9D; --fg-faint:#79816F;
  --accent:#5FA880; --accent-soft:#1A2E22; --accent-ink:#A3D9B8;
  --ember:#DD8B4E; --ember-soft:#362314;
  --danger:#E8766A; --soon:#CFA441;
  --on-accent:#0E1A13; --on-ember:#2A1708; --on-danger:#2A100C; --on-soon:#231A06;
  --k-health:#5FA880; --k-class:#7FB3D1; --k-study:#DD8B4E; --k-project:#A896C9; --k-meal:#CFA441; --k-rest:#A5AC9D;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141815; --surface:#1C211D; --surface-2:#262C27; --surface-3:#323A33;
  --line:#3A433B; --line-soft:#2A312B;
  --fg:#F2EDE0; --fg-dim:#A5AC9D; --fg-faint:#79816F;
  --accent:#5FA880; --accent-soft:#1A2E22; --accent-ink:#A3D9B8;
  --ember:#DD8B4E; --ember-soft:#362314;
  --danger:#E8766A; --soon:#CFA441;
  --on-accent:#0E1A13; --on-ember:#2A1708; --on-danger:#2A100C; --on-soon:#231A06;
  --k-health:#5FA880; --k-class:#7FB3D1; --k-study:#DD8B4E; --k-project:#A896C9; --k-meal:#CFA441; --k-rest:#A5AC9D;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.brandrow{display:flex;align-items:center;gap:12px;padding-block:12px 10px}
/* The mark keeps its own fixed colours in both themes: a logo that re-tints per theme stops being a logo. */
.mark{width:32px;height:32px;flex:none;display:block}
.mark img{width:100%;height:100%;display:block;border-radius:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.02em}
.brandsub{font-size:11.5px;color:var(--fg-faint);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;margin-top:-2px}
.streakchip{margin-left:auto;display:flex;align-items:baseline;gap:5px;background:var(--ember-soft);color:var(--ember);border-radius:999px;padding:5px 11px 5px 10px;flex:none}
.streakchip b{font-family:var(--f-display);font-size:16px;line-height:1}
.streakchip small{font-size:10.5px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;opacity:.9}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid transparent;background:none;color:var(--fg-dim);padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
main{padding-block:18px 96px;display:flex;flex-direction:column;gap:16px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px}
.card.flat{background:none;border:none;padding:0}
.ch{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px}
.ch h2{font-size:16px;font-weight:700}
.ch .hint{font-size:12px;color:var(--fg-faint);margin-left:auto;font-family:var(--f-mono);white-space:nowrap}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg-faint)}
.sub{color:var(--fg-dim);font-size:13.5px}
.row{display:flex;gap:10px;align-items:center}
.sp{margin-left:auto}

/* ---------- today banner ---------- */
.banner{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
.banner .stripe{height:4px;background:var(--accent)}
.banner.rest .stripe{background:var(--k-rest)}
.banner.cardio .stripe{background:var(--ember)}
.banner.mobility .stripe{background:var(--k-project)}
.banner .inner{padding:15px 16px}
.banner h1{font-size:23px;font-weight:800;margin-top:3px}
.banner .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.pill{font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);color:var(--fg-dim);border-radius:999px;padding:4px 9px}
.pill.on{background:var(--accent-soft);color:var(--accent-ink)}

/* ---------- exercise list ---------- */
.ex{border-top:1px solid var(--line-soft);padding:12px 0}
.ex:first-child{border-top:none;padding-top:2px}
.ex-top{display:flex;gap:12px;align-items:flex-start}
.ex-name{font-weight:600;font-size:15px;line-height:1.3}
.ex-meta{font-family:var(--f-mono);font-size:11.5px;color:var(--fg-faint);margin-top:3px}
.ex-dose{font-family:var(--f-mono);font-size:13px;color:var(--fg);white-space:nowrap;padding-top:1px}
.ex-acts{display:flex;gap:6px;margin-left:auto;flex:none;align-items:center}
.pips{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 10px}
.pips[data-full="1"]{background:var(--accent);border-color:var(--accent)}
.pip{width:9px;height:9px;border-radius:50%;background:var(--line);border:1px solid var(--fg-faint)}
.pip.on{background:var(--accent);border-color:var(--accent)}
.pips[data-full="1"] .pip{background:var(--on-accent);border-color:var(--on-accent)}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg-dim);display:grid;place-items:center;font-size:14px;flex:none}
.iconbtn:hover{color:var(--fg);border-color:var(--fg-faint)}
.cue{margin-top:9px;font-size:13.5px;color:var(--fg-dim);background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;line-height:1.55}
/* schematic form diagrams: two positions, drawn not photographed */
.fig{width:100%;max-width:330px;height:auto;display:block;margin:2px auto 10px}
.fig .ln{stroke:var(--fg-faint);stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .hd{fill:var(--fg-faint)}
.fig .b .ln{stroke:var(--accent)}
.fig .b .hd{fill:var(--accent)}
.fig .gr{stroke:var(--fg-faint);stroke-width:2;opacity:.4;stroke-linecap:round}
.fig .lb{fill:var(--fg-faint);font-family:var(--f-mono);font-size:9.5px}
.dosebar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 9px}
.dosebar span{font-family:var(--f-mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);
  border-radius:999px;padding:4px 9px;color:var(--fg)}
.dosebar span.key{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.demo{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:12.5px;font-family:var(--f-mono);
  color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:1px}
.ex-dose{font-family:var(--f-mono);font-size:13px;color:var(--fg);white-space:nowrap;font-weight:500}
.ex.done .ex-name{color:var(--fg-dim)}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--fg-faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ember{background:var(--ember);border-color:var(--ember);color:var(--on-ember)}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%;justify-content:center;text-align:center}

/* ---------- forms ---------- */
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label.fl{display:flex;flex-direction:column;gap:5px;min-width:0}
label.fl > span{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-faint)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;background:var(--bg);border:none;padding:9px 6px;font-size:13px;color:var(--fg-dim);border-left:1px solid var(--line)}
.seg button:first-child{border-left:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.switch{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-soft);cursor:pointer}
.switch:first-of-type{border-top:none}
.box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:transparent;margin-top:1px;background:var(--bg)}
.switch[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.switch[aria-checked="true"] .sw-l{color:var(--fg-dim);text-decoration:line-through;text-decoration-color:var(--line)}
.sw-l{font-size:14px;line-height:1.4}

/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column}
.blk{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:start;padding:9px 0;border-top:1px solid var(--line-soft);position:relative}
.blk:first-child{border-top:none}
.blk .t{font-family:var(--f-mono);font-size:12px;color:var(--fg-faint);padding-top:2px}
.blk .bar{width:3px;border-radius:2px;background:var(--k-rest);grid-row:1;position:absolute;left:54px;top:11px;bottom:11px}
.blk .lab{font-size:14.5px;font-weight:500}
.blk .dur{font-family:var(--f-mono);font-size:11.5px;color:var(--fg-faint);margin-top:2px}
.blk.now{background:var(--accent-soft);border-radius:9px;padding-inline:8px;margin-inline:-8px}
.blk.now .lab{color:var(--accent-ink);font-weight:600}
.blk.past .lab,.blk.past .t{opacity:.5}
.kind-health .bar{background:var(--accent)}
.kind-class .bar{background:var(--k-class)}
.kind-study .bar{background:var(--k-study)}
.kind-project .bar{background:var(--k-project)}
.kind-meal .bar{background:var(--k-meal)}
.kind-rest .bar{background:var(--k-rest)}
.nowline{display:flex;align-items:center;gap:8px;margin:2px 0 2px 54px}
.nowline .dot{width:9px;height:9px;border-radius:50%;background:var(--ember);flex:none;margin-left:-3px}
.nowline .ln{height:1.5px;background:var(--ember);flex:1;opacity:.55}
.nowline span{font-family:var(--f-mono);font-size:10.5px;color:var(--ember);text-transform:uppercase;letter-spacing:.08em}

/* ---------- tasks ---------- */
.task{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;padding:11px 0;border-top:1px solid var(--line-soft)}
.task:first-child{border-top:none}
.task .ttl{font-size:14.5px;font-weight:500;line-height:1.35;word-break:break-word}
.task.done .ttl{text-decoration:line-through;color:var(--fg-dim);text-decoration-color:var(--line)}
.task .tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center}
.tag{font-family:var(--f-mono);font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--fg-dim);text-transform:uppercase;letter-spacing:.05em}
.tag.due-over{background:var(--danger);color:var(--on-danger)}
.tag.due-today{background:var(--ember);color:var(--on-ember)}
.tag.due-soon{color:var(--on-soon);background:var(--soon)}
.tag.prio{border:1px solid var(--line);background:none}
.meter{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:10px}
.legend div{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-dim);font-family:var(--f-mono)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}

/* ---------- stats / charts ---------- */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:13px 14px}
.tile .v{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile .k{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-faint);margin-top:5px}
.tile .v small{font-size:13px;font-weight:600;color:var(--fg-dim);letter-spacing:0}
.grid-weeks{display:grid;grid-template-columns:auto 1fr;gap:8px}
.gdays{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-family:var(--f-mono);font-size:9.5px;color:var(--fg-faint)}
.gdays span{display:grid;align-items:center;height:14px}
.gcols{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:2px}
.gcell{height:14px;min-width:14px;border-radius:3px;background:var(--surface-2)}
.gcell.rest{background:var(--line-soft)}
.gcell.miss{background:none;border:1.5px dashed var(--line)}
.gcell.done{background:var(--accent)}
.gcell.part{background:var(--accent);opacity:.45}
.gcell.future{background:none;border:1px solid var(--line-soft)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.habitrow{display:grid;grid-template-columns:1fr 54px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line-soft)}
.habitrow:first-of-type{border-top:none}
.habitrow .hl{font-size:13px;color:var(--fg-dim);line-height:1.35}
.habitrow .hv{font-family:var(--f-mono);font-size:11.5px;color:var(--fg-faint);text-align:right}
.hbar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.hbar i{display:block;height:100%;background:var(--accent)}

/* ---------- empty ---------- */
.empty{text-align:center;padding:22px 10px;color:var(--fg-dim)}
.empty p{margin:0 0 4px;font-size:14px}
.empty .eyebrow{margin-bottom:8px}

/* ---------- live bar ---------- */
.livebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:11px;padding-bottom:calc(11px + env(safe-area-inset-bottom,0px))}
.livebar .inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.livebar .clock{font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.livebar .cl{font-family:var(--f-mono);font-size:10.5px;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.08em}
.livebar.resting{background:var(--ember-soft);border-top-color:var(--ember)}
.livebar.resting .clock{color:var(--ember)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.22)}
.note{font-size:12.5px;color:var(--fg-faint);line-height:1.5}
hr.div{border:none;border-top:1px solid var(--line-soft);margin:14px 0}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .22s ease-out}
  @keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
}
/* ---------- journey / overall progress ---------- */
.bigstat{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
.walkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px}
.walkgrid .wl{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-faint)}
.walkgrid .wv{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em;margin-top:1px}
@media (max-width:420px){.walkgrid{grid-template-columns:repeat(2,1fr);gap:12px}}
.jbar{position:relative;height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:16px 0 6px}
.jbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ember));border-radius:999px}
.jbar .tick{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg);opacity:.45;border-radius:2px}
.jmarks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--fg-faint)}
.miles{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.mile{font-family:var(--f-mono);font-size:11.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--fg-faint);background:none}
.mile.hit{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mile.next{border-color:var(--ember);color:var(--ember)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px;margin-top:14px}
.kv > div > b{display:block;font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kv > div > span{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-faint)}

/* ---------- checks ---------- */
.chk{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft);align-items:start}
.chk:first-of-type{border-top:none}
.chk .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--accent)}
.chk.warn .dot{background:var(--soon)}
.chk.bad .dot{background:var(--danger)}
.chk b{font-size:14px;font-weight:600;display:block}
.chk p{margin:3px 0 0;font-size:13px;color:var(--fg-dim);line-height:1.5}

/* ---------- ai ---------- */
.ai{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;margin-top:12px;
  font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:var(--fg)}
.ai.think{color:var(--fg-faint);font-style:italic;white-space:normal}
.aifoot{font-size:11px;color:var(--fg-faint);margin-top:8px;font-family:var(--f-mono)}

/* ---------- diet ---------- */
.macros{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:9px;margin-top:12px}
.macro{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 11px}
.macro b{display:block;font-family:var(--f-display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.macro span{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-faint)}
.plate{border-top:1px solid var(--line-soft);padding:10px 0;font-size:13.5px;line-height:1.5}
.plate:first-of-type{border-top:none}
.plate b{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-faint);display:block;margin-bottom:3px}
.loadin{width:70px!important;padding:6px 8px!important;font-size:12.5px!important;font-family:var(--f-mono)}
.opt{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line-soft)}
.opt:first-of-type{border-top:none}
.opt .on{font-size:14px;font-weight:500;line-height:1.3}
.opt .op{font-family:var(--f-mono);font-size:11.5px;color:var(--fg-faint);margin-top:2px}
.opt .ok{font-family:var(--f-mono);font-size:12px;color:var(--fg-dim);text-align:right;white-space:nowrap}
.opt .ok b{display:block;color:var(--accent);font-weight:600}
.addbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--accent);background:none;color:var(--accent);font-size:18px;line-height:1;display:grid;place-items:center;flex:none}
.addbtn:hover{background:var(--accent);color:var(--on-accent)}
.mealhead{display:flex;align-items:baseline;gap:8px;margin:16px 0 4px}
.mealhead:first-of-type{margin-top:4px}
.mealhead .eyebrow{flex:1}
.tally{display:flex;gap:14px;background:var(--surface-2);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:4px;align-items:center;flex-wrap:wrap}
.tally b{font-family:var(--f-display);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.tally span{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-faint);display:block;margin-top:2px}
.lock{display:flex;gap:11px;align-items:center;background:var(--surface-2);border-radius:var(--r-sm);padding:13px}
.lock .sw-l{font-size:13.5px;color:var(--fg-dim);line-height:1.45}

/* ---------- smoking ---------- */
.smokerow{display:flex;align-items:center;gap:14px;margin:4px 0 2px}
.smokecount{font-family:var(--f-display);font-size:42px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.smokecount.over{color:var(--danger)}
.smokeof{font-family:var(--f-mono);font-size:12px;color:var(--fg-faint);margin-top:5px}
.bigbtn{border:none;border-radius:12px;background:var(--ember);color:var(--on-ember);font-family:var(--f-display);
  font-size:15px;font-weight:700;padding:14px 20px;min-height:50px;letter-spacing:-.01em}
.bigbtn:hover{filter:brightness(1.08)}
.bigbtn.calm{background:var(--accent);color:var(--on-accent)}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.slot{font-family:var(--f-mono);font-size:11.5px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);color:var(--fg-faint);background:none}
button.slot{color:var(--fg-dim)}
button.slot:hover{border-color:var(--accent);color:var(--accent)}
.slot.used{background:var(--surface-3);border-color:var(--surface-3);color:var(--fg-dim);text-decoration:line-through}
.slot.next{border-color:var(--ember);color:var(--ember);font-weight:600}
.hours{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:64px;margin-top:6px}
.hours > div{background:var(--ember);border-radius:3px 3px 0 0;min-height:2px;opacity:.75}
.hourlab{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-family:var(--f-mono);font-size:9px;color:var(--fg-faint);margin-top:5px;text-align:center}

@media (max-width:430px){
  .banner h1{font-size:20px}
  .tile .v{font-size:23px}
  .blk{grid-template-columns:54px 1fr auto;gap:10px}
  .blk .bar{left:47px}
  .nowline{margin-left:47px}
}
/* ---------- phone: tab bar moves to the bottom, thumb-sized ---------- */
@media (max-width:640px){
  body{font-size:15.5px}
  .brandrow{padding-block:11px 9px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);
    gap:0;overflow:visible;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
  .tab{flex:1;text-align:center;padding:11px 4px;font-size:12.5px;border-radius:10px;min-height:44px}
  main{padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  .livebar{bottom:calc(62px + env(safe-area-inset-bottom,0px));padding-bottom:11px;border-radius:0}
  .toast{bottom:calc(132px + env(safe-area-inset-bottom,0px))}
  .iconbtn{width:38px;height:38px}
  .pips{padding:9px 11px}
  .btn{padding:11px 15px}
  .btn.sm{padding:8px 12px}
  .card{padding:15px 14px}
  .switch{padding:13px 0}
  input,select,textarea{padding:11px 10px;font-size:16px}
  .loadin{font-size:13px!important;padding:7px 8px!important}
}
</style>

"use strict";
/* ============================ utilities ============================ */
var DAY=86400000;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmtKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseKey(k){var p=String(k).split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function todayKey(){return fmtKey(new Date())}
function addDays(k,n){return fmtKey(new Date(parseKey(k).getTime()+n*DAY))}
function daysBetween(a,b){return Math.round((parseKey(b)-parseKey(a))/DAY)}
function toMin(t){var p=String(t||"0:00").split(":");return (+p[0]||0)*60+(+p[1]||0)}
function fmtTime(m){m=((Math.round(m)%1440)+1440)%1440;var h=Math.floor(m/60),mm=m%60;var ap=h<12?"am":"pm";var hh=h%12===0?12:h%12;return hh+":"+String(mm).padStart(2,"0")+ap}
function toHHMM(m){m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function niceCeil(v){if(v<=0)return 1;var e=Math.pow(10,Math.floor(Math.log10(v)));var n=v/e;var s=n<=1?1:n<=2?2:n<=5?5:10;return s*e}

/* ============================ exercise library ============================ */
/* n name &#183; f focus &#183; u unit &#183; b base volume &#183; i impact &#183; side per-side &#183; c coaching cue */
var EX={
squat:{n:"Bodyweight squat",f:"Legs",u:"reps",b:14,i:"low",c:"Feet shoulder-width, toes turned out a little. Sit back and down like you are reaching for a chair, chest tall, knees tracking over the toes. Drive through the whole foot and squeeze your glutes at the top."},
sumo:{n:"Sumo squat",f:"Legs, inner thigh",u:"reps",b:14,i:"low",c:"Wide stance, toes out about 30 degrees. Drop straight down between your heels with the torso upright, knees pushing out over the toes."},
splitsq:{n:"Split squat",f:"Legs, balance",u:"reps",b:9,side:1,i:"low",c:"One foot forward, one back, about two shoe-lengths apart. Drop the back knee straight down toward the floor with the front shin near vertical. All reps on one side, then switch."},
revlunge:{n:"Reverse lunge",f:"Legs, glutes",u:"reps",b:9,side:1,i:"low",c:"Stand tall, step one foot back and lower until the back knee nearly touches the floor, then push through the front heel to stand. Stepping back is kinder to the knees than stepping forward."},
bulgarian:{n:"Bed split squat",f:"Legs, glutes",u:"reps",b:8,side:1,i:"low",c:"Rest the top of your back foot on the bed, front foot a stride ahead. Lower straight down until the front thigh is near parallel, then drive up. Touch the wall if you wobble."},
cossack:{n:"Cossack squat",f:"Legs, hips",u:"reps",b:6,side:1,i:"low",c:"Very wide stance. Shift your weight over one leg and sink down, the other leg straight with its toes up. Go only as deep as you can control."},
wallsit:{n:"Wall sit",f:"Legs, endurance",u:"sec",b:40,i:"low",c:"Back flat on the wall, slide down until the thighs are parallel to the floor and the knees are over the ankles. Hands off the thighs. Breathe steadily; burning quads are the point."},
stepup:{n:"Bed step-up",f:"Legs, glutes",u:"reps",b:10,side:1,i:"low",c:"Use a solid bed frame or chair at roughly knee height. Put one whole foot on it, stand up by driving through that leg, lower slowly. Do not push off the bottom foot."},
bridge:{n:"Glute bridge",f:"Glutes, hips",u:"reps",b:16,i:"low",c:"Lie on your back with heels close to your hips. Drive your hips up until the body is a straight line from knee to shoulder, squeeze hard for a second, lower under control."},
slbridge:{n:"Single-leg glute bridge",f:"Glutes",u:"reps",b:10,side:1,i:"low",c:"Same as the glute bridge but with one foot off the floor and that knee hugged toward your chest. Keep the hips level, no tilting toward the lifted side."},
calf:{n:"Calf raise",f:"Calves",u:"reps",b:20,i:"low",c:"Stand tall, rise onto the balls of your feet as high as you can, pause a second at the top, lower slowly. A wall for balance is fine."},
deepsquat:{n:"Deep squat hold",f:"Hips, ankles",u:"sec",b:40,i:"low",c:"Sink into the lowest squat you can with the heels down, elbows pressed against the inside of your knees. Breathe into your belly and let the hips open. Heels lifting at first is normal."},
inclinepu:{n:"Incline push-up",f:"Chest, arms",u:"reps",b:12,i:"low",c:"Hands on the edge of the desk or bed, body in one straight line. Lower your chest to the edge with the elbows at about 45 degrees from your sides, press back up. The higher the surface, the easier it is."},
kneepu:{n:"Knee push-up",f:"Chest, arms",u:"reps",b:12,i:"low",c:"Knees down, hips tucked so the line from knee to shoulder stays straight. Lower your chest to a fist off the floor and press up without letting the hips sag."},
pushup:{n:"Push-up",f:"Chest, arms, core",u:"reps",b:10,i:"low",c:"Hands just outside the shoulders, body rigid from heels to head. Lower until your chest is an inch off the floor, elbows tucked at 45 degrees, press up. Squeeze the glutes so the hips do not dip."},
widepu:{n:"Wide push-up",f:"Chest",u:"reps",b:10,i:"low",c:"Hands about one and a half shoulder-widths apart. Lower slowly; you will feel this more across the chest and less in the triceps."},
diamondpu:{n:"Diamond push-up",f:"Triceps, chest",u:"reps",b:8,i:"low",c:"Hands together under your chest, index fingers and thumbs forming a diamond. Keep the elbows brushing past your ribs. This one is hard, so drop to the knees before your form breaks."},
declinepu:{n:"Feet-up push-up",f:"Chest, shoulders",u:"reps",b:9,i:"low",c:"Feet on the bed, hands on the floor. The higher the feet, the more the shoulders take. Stop the hips from piking up."},
pikepu:{n:"Pike push-up",f:"Shoulders",u:"reps",b:8,i:"low",c:"From a push-up, walk the feet in and lift the hips so the body makes an upside-down V. Lower the crown of your head toward the floor between your hands, then press back up."},
dip:{n:"Chair dip",f:"Triceps",u:"reps",b:10,i:"low",c:"Sit on the edge of a solid chair or bed, hands beside your hips, slide forward. Bend the elbows straight back until the upper arms are near parallel, then press up. Keep the shoulders down, away from your ears."},
shouldertap:{n:"Plank shoulder tap",f:"Shoulders, core",u:"reps",b:16,i:"low",c:"High plank with the feet a little wide. Tap the opposite shoulder with one hand without letting the hips rotate. Slow beats fast here."},
doorrow:{n:"Towel door row",f:"Back, biceps",u:"reps",b:12,i:"low",c:"Loop a towel around both sides of a door handle and grip an end in each hand. Stand close with your feet near the door, lean back with straight arms, then pull your chest toward the door, driving the elbows behind you. Lean back further to make it harder."},
tablerow:{n:"Desk row",f:"Back, biceps",u:"reps",b:10,i:"low",c:"Only with a heavy, solid desk. Lie underneath, grip the edge overhand, body straight, and pull your chest up to the edge. Bend the knees to make it easier."},
superman:{n:"Superman",f:"Lower back, glutes",u:"reps",b:12,i:"low",c:"Lie face down with the arms stretched overhead. Lift your chest, arms and legs a few inches off the floor, squeeze for two seconds, lower. Reach long rather than high."},
snowangel:{n:"Reverse snow angel",f:"Upper back",u:"reps",b:10,i:"low",c:"Face down, arms by your sides, palms down. Lift the arms off the floor and sweep them overhead and back, straight and off the ground the whole way. The best antidote to a day hunched over a laptop."},
wslide:{n:"Wall slide",f:"Upper back, posture",u:"reps",b:12,i:"low",c:"Back, head and arms against the wall, elbows bent at 90 degrees, backs of the hands touching the wall. Slide the arms overhead and down without the hands or lower back leaving the wall."},
towelpull:{n:"Towel pull-apart",f:"Upper back",u:"reps",b:14,i:"low",c:"Hold a towel taut between both hands at chest height, arms straight. Pull outward hard as if tearing it, squeezing the shoulder blades together, hold two seconds, release."},
plank:{n:"Plank",f:"Core",u:"sec",b:40,i:"low",c:"Forearms and toes down, elbows under the shoulders. Pull the belly in, tuck the ribs down and squeeze the glutes so the body is one straight line. Stop the moment the hips start to sag."},
sideplank:{n:"Side plank",f:"Obliques",u:"sec",b:25,side:1,i:"low",c:"On one forearm, elbow under the shoulder, feet stacked or staggered. Lift the hips so the body is a straight diagonal. Drop to the bottom knee if you need to."},
hollow:{n:"Hollow hold",f:"Deep core",u:"sec",b:25,i:"low",c:"On your back, press the lower back into the floor, then lift the shoulders and legs a few inches. If the lower back lifts off the floor, bring the legs higher."},
deadbug:{n:"Dead bug",f:"Core control",u:"reps",b:10,side:1,i:"low",c:"On your back, arms up, knees over the hips at 90 degrees. Lower one arm overhead and the opposite leg toward the floor with the lower back pressed down. Return, then switch."},
birddog:{n:"Bird dog",f:"Core, back",u:"reps",b:10,side:1,i:"low",c:"On hands and knees, extend one arm forward and the opposite leg back until both are level with your torso. Do not let the hips tip. Pause two seconds, switch."},
legraise:{n:"Lying leg raise",f:"Lower abs",u:"reps",b:12,i:"low",c:"On your back, hands under the hips or beside you. Keep the legs fairly straight, lift them toward vertical, then lower slowly and stop before the lower back arches."},
revcrunch:{n:"Reverse crunch",f:"Lower abs",u:"reps",b:12,i:"low",c:"On your back with the knees bent toward your chest. Curl the hips off the floor to bring the knees toward your face, then lower one vertebra at a time. Control, not momentum."},
bicycle:{n:"Bicycle crunch",f:"Obliques",u:"reps",b:16,i:"low",c:"On your back, hands light behind the head. Bring one elbow and the opposite knee toward each other while the other leg extends. Rotate from the ribs; never yank the neck."},
flutter:{n:"Flutter kick",f:"Lower abs",u:"sec",b:30,i:"low",c:"On your back, legs straight and a few inches off the floor. Small, quick alternating kicks with the lower back pressed down."},
vup:{n:"V-up",f:"Core",u:"reps",b:10,i:"low",c:"On your back, arms overhead. Lift the legs and torso together to touch hands to feet, then lower both without resting. Bend the knees to scale it down."},
hipdip:{n:"Side plank hip dip",f:"Obliques",u:"reps",b:10,side:1,i:"low",c:"From a side plank, lower the hip toward the floor without touching, then lift back above the start line. Keep the shoulder stacked over the elbow."},
crunch:{n:"Crunch",f:"Upper abs",u:"reps",b:16,i:"low",c:"On your back, knees bent, hands light behind the head or crossed on the chest. Curl the shoulder blades a few inches off the floor by shortening the abs, pause at the top, lower slowly. The lower back stays down throughout."},
heeltap:{n:"Heel tap",f:"Obliques",u:"reps",b:16,i:"low",c:"On your back, knees bent, shoulders curled slightly off the floor the whole set. Reach one hand down the side of your body to tap that heel, then the other. Short, controlled reaches, not a rocking motion."},
legdrop:{n:"Single-leg lower",f:"Lower abs",u:"reps",b:10,side:1,i:"low",c:"On your back with both legs up at 90 degrees. Press the lower back flat and lower one leg toward the floor as far as you can without the back arching, then bring it back. The honest way into full leg raises."},
scissor:{n:"Scissor kick",f:"Lower abs",u:"sec",b:30,i:"low",c:"On your back, legs straight and a few inches off the floor. Cross one leg over the other and switch, like scissors opening and closing. The lower back stays pressed into the floor."},
russian:{n:"Russian twist",f:"Obliques",u:"reps",b:16,i:"low",c:"Sit with the knees bent and heels light on the floor, leaning back to about 45 degrees. Rotate through the ribs side to side, tapping the floor beside each hip. Hold a full water bottle or a thick book to make it harder."},
kneetuck:{n:"Seated knee tuck",f:"Lower abs",u:"reps",b:12,i:"low",c:"Sit on the floor, hands behind you for support, legs extended and hovering. Pull both knees in toward your chest, then extend back out without letting the heels touch down."},
boat:{n:"Boat hold",f:"Deep core, hips",u:"sec",b:25,i:"low",c:"Sit, lean back and lift the shins parallel to the floor, chest tall, arms reaching forward. Straighten the legs to make it harder. A flat back with bent knees always beats a rounded back with straight legs."},
windshield:{n:"Windshield wiper",f:"Obliques",u:"reps",b:10,i:"low",c:"On your back, arms out wide to anchor you, legs up. Lower both legs together to one side, stopping before the opposite shoulder peels off the floor, then sweep to the other side. Bend the knees to shorten the lever."},
hollowrock:{n:"Hollow rock",f:"Deep core",u:"sec",b:25,i:"low",c:"Hold a hollow position, then rock the whole rigid body back and forth from the shoulders to the hips. The shape never changes; only the rocking moves."},
rollup:{n:"Roll-up",f:"Abs, spine",u:"reps",b:8,i:"low",c:"Lie flat with the arms overhead. Peel yourself off the floor one vertebra at a time until you are sitting and reaching past your toes, then reverse it just as slowly. No momentum, no jerking up."},
plankstep:{n:"Plank step-out",f:"Core, shoulders",u:"reps",b:14,i:"low",c:"High plank. Step one foot out to the side and back, then the other, with the hips level and completely still. The quiet version of a plank jack."},
plankjack:{n:"Plank jack",f:"Core, cardio",u:"sec",b:30,i:"high",c:"High plank, then jump both feet wide and back together while the upper body stays locked. Stop the hips bouncing up and down."},
updown:{n:"Plank up-down",f:"Core, triceps",u:"reps",b:10,i:"low",c:"Start on your forearms. Press up onto one hand, then the other, into a high plank, then lower back down one arm at a time. Keep the hips from swinging side to side."},
sitthrough:{n:"Bear sit-through",f:"Core, hips",u:"reps",b:12,i:"low",c:"From a bear hold with the knees hovering, lift one hand and thread the opposite leg underneath you, opening the hips toward the ceiling. Return and switch. Needs about a mat's worth of floor."},
sidecrunch:{n:"Standing side crunch",f:"Obliques",u:"reps",b:12,side:1,i:"low",c:"Stand tall with one hand behind the head. Drive that elbow down toward the hip on the same side, crunching through the side of your waist, then lengthen back up. Useful when there is no floor space free."},
plankreach:{n:"Plank reach",f:"Deep core",u:"reps",b:8,side:1,i:"low",c:"High plank with the feet a little wide. Reach one arm straight out in front of you and hold two seconds without letting the hips rotate. The slower you go, the harder it gets."},
stepjack:{n:"Step jack",f:"Cardio",u:"sec",b:40,i:"low",c:"Step one foot out to the side while sweeping both arms overhead, then step back and repeat on the other side. All the heart rate of a jumping jack with none of the thud."},
marchknee:{n:"Marching high knee",f:"Cardio, core",u:"sec",b:40,i:"low",c:"March in place, driving each knee to hip height and pumping the opposite arm. Stay tall and go fast without letting the heels slam down."},
mountain:{n:"Mountain climber",f:"Cardio, core",u:"sec",b:35,i:"low",c:"High plank, hips low and still. Drive one knee toward your chest and switch, shoulders stacked over the hands. Quick feet, quiet landings."},
shadowbox:{n:"Shadow boxing",f:"Cardio, shoulders",u:"sec",b:45,i:"low",c:"Light stance, hands up. Throw fast straight punches, rotating through the hips and staying light on your feet. Keep the elbows soft at the end of each punch."},
skater:{n:"Skater step",f:"Cardio, glutes",u:"sec",b:40,i:"low",c:"Step wide to one side and let the other leg sweep behind you, then push back the other way. A speed skater, stepping instead of jumping."},
inchworm:{n:"Inchworm walkout",f:"Full body",u:"reps",b:8,i:"low",c:"Stand, fold forward, walk the hands out to a plank, hold a beat, walk them back and stand. Keep the legs as straight as your hamstrings allow."},
squatplank:{n:"Squat to plank",f:"Full body",u:"reps",b:8,i:"low",c:"A burpee without the jumping. Squat, place the hands down, walk the feet back to a plank, then step them in and stand tall."},
bearhold:{n:"Bear crawl hold",f:"Core, shoulders",u:"sec",b:30,i:"low",c:"Hands and toes down, knees hovering an inch off the floor, back flat. Hold still and breathe. Add slow opposite hand-and-knee lifts if it feels easy."},
jumpingjack:{n:"Jumping jack",f:"Cardio",u:"sec",b:40,i:"high",c:"Jump the feet wide while the arms sweep overhead, then back together. Land softly through the balls of the feet."},
highknee:{n:"High knees",f:"Cardio",u:"sec",b:35,i:"high",c:"Run in place, driving the knees up to hip height, landing light and fast on the balls of your feet."},
burpee:{n:"Burpee",f:"Full body, cardio",u:"reps",b:8,i:"high",c:"Squat, hands down, jump the feet back to a plank, chest to the floor, jump the feet in and leap up. Pace yourself; this one empties the tank."},
jumpsquat:{n:"Jump squat",f:"Legs, power",u:"reps",b:10,i:"high",c:"Squat to about parallel, then drive up and leave the floor. Land with soft knees straight into the next squat."},
catcow:{n:"Cat-cow",f:"Spine",u:"reps",b:10,i:"low",c:"On hands and knees. Inhale and drop the belly while lifting the chest and tailbone; exhale and round the back, tucking the chin. Move one segment of the spine at a time."},
worldgreat:{n:"World's greatest stretch",f:"Hips, spine",u:"reps",b:5,side:1,i:"low",c:"Step into a deep lunge, put the inside hand on the floor, then rotate the outside arm up to the ceiling and follow it with your eyes. Hold two breaths, switch."},
hipflexor:{n:"Hip flexor stretch",f:"Hips",u:"sec",b:40,side:1,i:"low",c:"Half-kneeling with the back knee on something soft. Tuck the tailbone under and press the hips gently forward until the front of the back hip opens. Do not arch the lower back."},
openbook:{n:"Open book",f:"Mid-back",u:"reps",b:8,side:1,i:"low",c:"Lie on your side, knees stacked and bent, arms together in front. Keeping the knees down, sweep the top arm across to the other side and let the chest follow. Exhale as you open."},
hamstring:{n:"Hamstring stretch",f:"Hamstrings",u:"sec",b:40,side:1,i:"low",c:"Sit with one leg straight and the other foot tucked in. Hinge from the hip with a flat back, reaching toward the foot until you feel a stretch, never pain, behind the knee and thigh."},
childpose:{n:"Child's pose",f:"Back, shoulders",u:"sec",b:45,i:"low",c:"Kneel, sit back on your heels and walk the hands forward, forehead toward the floor. Widen the knees to let the belly settle. Breathe into your back."},
neckroll:{n:"Neck and shoulder reset",f:"Neck, posture",u:"sec",b:45,i:"low",c:"Roll the shoulders back five times. Then tip one ear gently to the shoulder and hold, switch sides, and finish by tucking the chin straight back five times. Built for a day spent over a laptop."},
chestdoor:{n:"Doorway chest stretch",f:"Chest, shoulders",u:"sec",b:35,side:1,i:"low",c:"Forearm flat on the door frame, elbow at shoulder height. Step the opposite foot through and turn the chest away until you feel it across the front of the shoulder."},
ninety:{n:"90/90 hip switch",f:"Hips",u:"reps",b:8,i:"low",c:"Sit with both knees bent at 90 degrees, one leg in front and one to the side. Lift the knees and rotate them over to the other side without using your hands. Slow and controlled."},
fold:{n:"Standing forward fold",f:"Hamstrings, back",u:"sec",b:40,i:"low",c:"Feet hip-width, knees soft. Hinge forward and let the head and arms hang heavy. Sway gently and breathe; let gravity do the work."},
quadwall:{n:"Wall quad stretch",f:"Quads",u:"sec",b:35,side:1,i:"low",c:"Kneel facing away from the wall and rest the top of one foot on it, or grab the ankle standing. Tuck the tailbone and stand tall until the front of the thigh lengthens."},

/* ---- gym, for whenever you join one ---- */
gchestmch:{n:"Machine chest press",f:"Chest",u:"reps",b:11,rr:"8-12",i:"low",gym:1,c:"Set the seat so the handles line up with the middle of your chest. Press out, stopping just short of locking the elbows, and control the weight all the way back."},
gdbpress:{n:"Incline dumbbell press",f:"Upper chest",u:"reps",b:10,rr:"8-12",i:"low",gym:1,c:"Bench at about 30 degrees. Press the dumbbells up and slightly together without clanging them, lower until you feel a stretch across the chest."},
gbench:{n:"Barbell bench press",f:"Chest, triceps",u:"reps",b:8,rr:"6-10",i:"low",gym:1,c:"Shoulder blades pulled back and down into the bench, feet planted. Lower the bar to the lower chest under control, then press. Use a spotter or set the safety pins when it gets heavy."},
gfly:{n:"Cable fly",f:"Chest",u:"reps",b:13,rr:"10-15",i:"low",gym:1,c:"A slight bend in the elbows, held the whole time. Bring the hands together in a wide arc in front of your chest and squeeze, then open slowly into the stretch."},
gohp:{n:"Overhead press",f:"Shoulders",u:"reps",b:9,rr:"6-10",i:"low",gym:1,c:"Bar or dumbbells at shoulder height, ribs down, glutes tight. Press straight overhead, moving your head back slightly to let the bar pass, finishing with the arms by your ears."},
glatraise:{n:"Lateral raise",f:"Side delts",u:"reps",b:14,rr:"12-15",i:"low",gym:1,c:"Light dumbbells, a slight forward lean. Raise the arms out to the sides to shoulder height, leading with the elbows. If you have to swing, the weight is too heavy."},
gpushdown:{n:"Triceps pushdown",f:"Triceps",u:"reps",b:13,rr:"10-15",i:"low",gym:1,c:"Elbows pinned to your sides and the body still. Push the bar or rope down to straight arms, squeeze, and let it rise only until the forearms are parallel."},
goht:{n:"Overhead triceps extension",f:"Triceps",u:"reps",b:12,rr:"10-15",i:"low",gym:1,c:"Rope or dumbbell overhead, elbows pointing forward and close together. Lower behind your head into the stretch, then extend without letting the elbows flare out."},
gdip:{n:"Assisted dip",f:"Chest, triceps",u:"reps",b:9,rr:"6-12",i:"low",gym:1,c:"Use the assist machine or a band. Lean slightly forward to hit the chest, stay upright for triceps. Lower until the upper arms are parallel, then press up."},
glatpd:{n:"Lat pulldown",f:"Lats, biceps",u:"reps",b:11,rr:"8-12",i:"low",gym:1,c:"Thighs locked under the pad, a slight lean back. Pull the bar to your upper chest by driving the elbows down and back, then control it all the way up until the lats stretch."},
gpullup:{n:"Assisted pull-up",f:"Lats, biceps",u:"reps",b:7,rr:"5-10",i:"low",gym:1,c:"Set the assistance so the last rep is hard but still clean. Start from a full hang, pull your chest toward the bar, lower under control."},
grow:{n:"Seated cable row",f:"Mid back",u:"reps",b:11,rr:"8-12",i:"low",gym:1,c:"Chest tall, a slight lean forward at the stretch. Pull the handle to your navel, squeezing the shoulder blades together, then let the arms extend without rounding your back."},
gcsrow:{n:"Chest-supported row",f:"Mid back",u:"reps",b:11,rr:"8-12",i:"low",gym:1,c:"Chest on the pad so you cannot cheat with the lower back. Row by driving the elbows back, pause a beat at the top, lower slowly."},
gbbrow:{n:"Barbell row",f:"Back",u:"reps",b:9,rr:"6-10",i:"low",gym:1,c:"Hinge to about 45 degrees with a flat back and a braced core. Row the bar to your lower ribs and lower it under control. End the set when your back starts to round."},
gfacepull:{n:"Face pull",f:"Rear delts, posture",u:"reps",b:15,rr:"12-20",i:"low",gym:1,c:"Rope at face height. Pull it toward your forehead, splitting the hands apart and turning the knuckles to the ceiling. The best single fix for laptop shoulders."},
gcurl:{n:"Dumbbell curl",f:"Biceps",u:"reps",b:11,rr:"8-12",i:"low",gym:1,c:"Elbows by your ribs, no swinging. Curl up, squeeze, and lower over three seconds. The lowering is where most of the growth comes from."},
ghammer:{n:"Hammer curl",f:"Biceps, forearms",u:"reps",b:11,rr:"8-12",i:"low",gym:1,c:"Palms facing each other throughout. Curl without letting the elbows drift forward, then lower slowly."},
ggoblet:{n:"Goblet squat",f:"Legs",u:"reps",b:11,rr:"8-12",i:"low",gym:1,c:"Hold one dumbbell or kettlebell at your chest. Squat down between your knees with the chest tall, elbows brushing the inside of your knees at the bottom. The best squat to learn on."},
glegpress:{n:"Leg press",f:"Legs",u:"reps",b:11,rr:"8-12",i:"low",gym:1,c:"Feet shoulder-width on the platform. Lower until the knees reach about 90 degrees without the lower back peeling off the pad, then press back without slamming the knees straight."},
gsquat:{n:"Barbell back squat",f:"Legs, glutes",u:"reps",b:7,rr:"5-8",i:"low",gym:1,c:"Bar on the upper back, feet shoulder-width, toes slightly out. Brace, sit down between your hips to at least parallel, drive up through the whole foot. Always set the safety pins."},
grdl:{n:"Romanian deadlift",f:"Hamstrings, glutes",u:"reps",b:9,rr:"6-10",i:"low",gym:1,c:"Soft knees, bar close to your legs. Push the hips back and let the bar slide down your thighs until you feel a strong hamstring stretch, then drive the hips forward. Flat back throughout."},
glegcurl:{n:"Leg curl",f:"Hamstrings",u:"reps",b:12,rr:"10-15",i:"low",gym:1,c:"Line your knee joint up with the machine's pivot. Curl the pad toward your glutes, pause, and lower over three seconds without letting the stack slam."},
glegext:{n:"Leg extension",f:"Quads",u:"reps",b:13,rr:"10-15",i:"low",gym:1,c:"Back against the pad, hands on the handles. Extend to straight, squeeze the quads for a second at the top, lower slowly."},
glunge:{n:"Walking lunge",f:"Legs, glutes",u:"reps",b:10,side:1,rr:"8-12",i:"low",gym:1,c:"Dumbbells at your sides. Step forward and drop the back knee toward the floor, then push through the front heel straight into the next step. Torso stays upright."},

var pending={},timers={};
function queue(path,data){
  pending[path]=data; lsSave();
  if(timers[path])clearTimeout(timers[path]);
  timers[path]=setTimeout(function(){flush(path)},500);
}
function flush(path){
  if(!DB||!canWrite||!(path in pending))return;
  var d=pending[path]; delete pending[path];
  DB.doc(path).set(d).catch(function(e){
    if(e&&e.code==="invalid_argument"){canWrite=false;toast("Saved on this device only")}
  });
}
function flushAll(){Object.keys(pending).forEach(flush)}
function saveProfile(){queue("profile/main",S.profile)}
function saveLog(k){queue("logs/"+k,S.logs[k])}
function saveTask(id){queue("tasks/"+id,S.tasks[id])}
function removeTask(id){
  delete S.tasks[id]; delete pending["tasks/"+id]; lsSave();
  if(DB&&canWrite)DB.doc("tasks/"+id).delete().catch(function(){});
}
function logFor(k){
  if(!S.logs[k])S.logs[k]={date:k,sets:{},swaps:{},habits:{},done:false,minutes:0};
  var l=S.logs[k];
  l.sets=l.sets||{}; l.swaps=l.swaps||{}; l.habits=l.habits||{};
  l.coreSets=l.coreSets||{}; l.coreSwaps=l.coreSwaps||{};
  l.cigTimes=l.cigTimes||[];
  l.oral=l.oral||{};
  l.spend=l.spend||[];
  return l;
}

/* ============================ workout engine ============================ */
function plansFor(p){return p.mode==="gym"?GYM_PLANS:PLANS}
function planKey(k,p){var pl=plansFor(p);return (pl[p.daysPerWeek]||pl[4])[parseKey(k).getDay()]}
function weekIndex(k,start){return Math.max(0,Math.floor(daysBetween(start||k,k)/7))}
function poolFor(cands,p){
  var pool=p.quiet?cands.filter(function(x){return EX[x].i!=="high"}):cands.slice();
  if(!pool.length)pool=cands.slice();
  var n=pool.length,lo=0,hi=n;
  if(p.level==="beginner")hi=Math.max(1,Math.round(n*0.7));
  else if(p.level==="advanced")lo=Math.min(n-1,Math.floor(n*0.34));
  var win=pool.slice(lo,hi);
  return win.length?win:pool;
}
function volume(ex,level,week){
  var lm=level==="beginner"?0.75:level==="advanced"?1.3:1;
  var v=ex.b*lm*(1+Math.min(week,14)*0.035);
  if(ex.u==="sec")return Math.max(15,Math.round(v/5)*5);
  return Math.max(4,Math.round(v));
}
function workoutFor(k){
  var p=S.profile,l=S.logs[k],key=planKey(k,p),week=weekIndex(k,p.startDate);
  if(key==="core"&&week%2===1)key="core-b";
  var t=TEMPLATES[key];
  var items=t.slots.map(function(cands,i){
    var pool=poolFor(cands,p);
    var ov=l&&l.swaps&&l.swaps[i];
    var exKey=(ov&&EX[ov])?ov:pool[hash(k+":"+i+":"+week)%pool.length];
    var ex=EX[exKey];
    return {i:i,key:exKey,ex:ex,amount:volume(ex,p.level,week),pool:pool};
  });
  var w={key:key,t:t,week:week,items:items,sets:t.sets,rest:t.rest,date:k};
  w.minutes=estMinutes(w);
  return w;
}
function estMinutes(w){
  if(!w.items.length)return 0;
  var secs=w.items.reduce(function(s,it){
    var work=it.ex.u==="sec"?it.amount:it.amount*3;
    if(it.ex.side)work*=2;
    return s+work+w.rest;
  },0);
  return Math.max(5,Math.round(secs*w.sets/60)+4);
}
function doseShort(it){
  if(it.ex.rr)return it.ex.rr;
  if(it.ex.u==="sec")return it.amount>=120?Math.round(it.amount/60)+" min":it.amount+"s";
  return String(it.amount);
}
function doseMain(it,w){
  if(!w||!w.sets)return doseText(it);
  return w.sets+' &times; '+doseShort(it)+(it.ex.u==="sec"?"":" reps")+(it.ex.side?" each side":"");
}
function doseText(it){
  if(it.ex.rr)return it.ex.rr+" reps"+(it.ex.side?" each side":"");
  var n=it.ex.u==="sec"
    ? (it.amount>=120?Math.round(it.amount/60)+" min":it.amount+"s")
    : it.amount+" reps";
  return n+(it.ex.side?" each side":"");
}
function coreFinFor(k){
  var p=S.profile,l=S.logs[k],week=weekIndex(k,p.startDate);
  var items=COREFIN.slots.map(function(cands,i){
    var pool=poolFor(cands,p);
    var ov=l&&l.coreSwaps&&l.coreSwaps[i];
    var key=(ov&&EX[ov])?ov:pool[hash("core:"+k+":"+i)%pool.length];
    var ex=EX[key];
    return {i:i,key:key,ex:ex,amount:volume(ex,p.level,week),pool:pool};
  });
  var w={items:items,sets:COREFIN.rounds,rest:COREFIN.rest,t:{tone:"strength"}};
  w.minutes=estMinutes(w);
  return w;
}
function coreProgress(k,cf){
  var l=S.logs[k]; if(!l||!cf.items.length)return 0;
  var d=0; cf.items.forEach(function(it){d+=Math.min((l.coreSets&&l.coreSets[it.i])||0,cf.sets)});
  return d/(cf.items.length*cf.sets);
}
function countCore(fromK,toK){
  return Object.keys(S.logs).filter(function(k){
    var l=S.logs[k];return l&&l.coreDone&&k>=fromK&&k<=toK}).length;
}
function setsDone(k,i){var l=S.logs[k];return (l&&l.sets&&l.sets[i])||0}
function workoutProgress(k,w){
  if(!w.items.length)return 1;
  var tot=w.items.length*w.sets,d=0;
  w.items.forEach(function(it){d+=Math.min(setsDone(k,it.i),w.sets)});
  return tot?d/tot:0;
}

/* ============================ streaks and stats ============================ */
function isSessionDay(k){return planKey(k,S.profile)!=="rest"}
function currentStreak(){
  var d=new Date(),k=fmtKey(d);
  if(!(S.logs[k]&&S.logs[k].done))d=new Date(d.getTime()-DAY);
  var n=0,start=S.profile.startDate;
  for(var i=0;i<500;i++){
    var kk=fmtKey(d);
    if(daysBetween(start,kk)<0)break;
    var done=!!(S.logs[kk]&&S.logs[kk].done);
    if(done)n++;
    else if(isSessionDay(kk))break;
    d=new Date(d.getTime()-DAY);
  }
  return n;
}
function bestStreak(){
  var start=S.profile.startDate,end=todayKey(),best=0,run=0;
  var n=Math.max(0,daysBetween(start,end));
  for(var i=0;i<=n;i++){
    var k=addDays(start,i),done=!!(S.logs[k]&&S.logs[k].done);
    if(done){run++;if(run>best)best=run}
    else if(isSessionDay(k))run=0;
  }
  return Math.max(best,currentStreak());
}
function weightSeries(){
  return Object.keys(S.logs).filter(function(k){return S.logs[k]&&typeof S.logs[k].weight==="number"})
    .sort().map(function(k){return {k:k,v:S.logs[k].weight}});
}
function sumMinutes(fromK,toK){
  return Object.keys(S.logs).reduce(function(s,k){
    var l=S.logs[k];
    if(l&&l.done&&k>=fromK&&k<=toK)s+=(l.minutes||0);
    return s;
  },0);
}
function countDone(fromK,toK){
  return Object.keys(S.logs).filter(function(k){
    var l=S.logs[k];return l&&l.done&&isSessionDay(k)&&k>=fromK&&k<=toK}).length;
}
function weekStart(k){var d=parseKey(k);return fmtKey(new Date(d.getTime()-d.getDay()*DAY))}

/* ============================ tasks ============================ */
function taskList(){
  return Object.keys(S.tasks).map(function(id){return S.tasks[id]}).filter(Boolean).sort(function(a,b){
    if(!!a.done!==!!b.done)return a.done?1:-1;
    var ad=a.due||"9999-99-99",bd=b.due||"9999-99-99";
    if(ad!==bd)return ad<bd?-1:1;
    return (b.prio||0)-(a.prio||0);
  });
}
function dueTag(t){
  if(!t.due)return {cls:"",txt:"no date"};
  var d=daysBetween(todayKey(),t.due);
  if(t.done)return {cls:"",txt:shortDate(t.due)};
  if(d<0)return {cls:"due-over",txt:(-d)+"d overdue"};
  if(d===0)return {cls:"due-today",txt:"due today"};
  if(d===1)return {cls:"due-soon",txt:"due tomorrow"};
  if(d<=4)return {cls:"due-soon",txt:"in "+d+" days"};
  return {cls:"",txt:shortDate(t.due)};
}
function shortDate(k){var d=parseKey(k);return d.getDate()+" "+MON[d.getMonth()]}
function studyHoursPerWeek(){
  var mins=0;
  (S.profile.blocks||[]).forEach(function(b){if(b.kind==="study"||b.kind==="project")mins+=(b.len||0)});
  return mins*7/60;
}
function loadNext7(){
  var t0=todayKey(),t1=addDays(t0,7),h=0;
  taskList().forEach(function(t){if(!t.done&&t.due&&t.due<=t1)h+=(+t.est||0)});
  return h;
}

/* ============================ overall progress ============================ */
var SAFE=0.007; /* fraction of bodyweight per week: the fastest pace that reliably keeps muscle */
function latestWeight(){var ws=weightSeries();return ws.length?ws[ws.length-1].v:null}
function lossRate(){
  var ws=weightSeries(); if(ws.length<2)return null;
  var cut=addDays(todayKey(),-28);
  var pts=ws.filter(function(p){return p.k>=cut});
  if(pts.length<2)pts=ws.slice(-2);
  var a=pts[0],b=pts[pts.length-1],days=daysBetween(a.k,b.k);
  if(days<7)return null;
  return (a.v-b.v)/(days/7);
}
function weeksAtPace(cur,goal,frac){
  if(!(cur>goal))return 0;
  return Math.ceil(Math.log(cur/goal)/(-Math.log(1-frac)));
}
function etaLabel(weeks){
  if(weeks==null)return "not yet";
  var d=new Date(Date.now()+weeks*7*DAY);
  return MON[d.getMonth()]+" "+d.getFullYear();
}
function journeyData(){
  var p=S.profile;
  var start=(typeof p.startWeight==="number")?p.startWeight:null;
  var cur=latestWeight(); if(cur==null)cur=start;
  var goal=(typeof p.goalWeight==="number")?p.goalWeight:null;
  if(start==null||goal==null||!(start>goal))return null;
  var total=start-goal,lost=start-cur,rate=lossRate();
  return {start:start,cur:cur,goal:goal,lost:lost,total:total,pct:clamp(lost/total,0,1),
    rate:rate,safeWeeks:weeksAtPace(cur,goal,SAFE),
    actualWeeks:(rate&&rate>0.05)?Math.ceil((cur-goal)/rate):null,
    tooFast:!!(rate&&rate>cur*0.013)};
}
/* two phases: hostel room with no equipment, then a job with a gym and a budget */
function phaseInfo(){
  var p=S.profile,t0=todayKey(),end=p.phase2Start;
  if(!end)return null;
  var total=Math.max(1,daysBetween(p.startDate,end));
  var done=clamp(daysBetween(p.startDate,t0),0,total);
  var left=daysBetween(t0,end);
  return {end:end,inP1:left>0,daysLeft:Math.max(0,left),weeksLeft:Math.max(0,Math.round(left/7*10)/10),
    pct:clamp(done/total,0,1),weekOf:Math.floor(done/7)+1,weeks:Math.ceil(total/7)};
}
function checkpointWeight(){
  var p=S.profile,ph=phaseInfo();
  if(!ph)return null;
  if(typeof p.phase1Target==="number")return p.phase1Target;
  var cur=latestWeight(); if(cur==null)cur=p.startWeight;
  if(cur==null)return null;
  if(!ph.inP1)return Math.round(cur*10)/10;
  return Math.round(cur*Math.pow(1-SAFE,ph.daysLeft/7)*10)/10;
}
function milestones(j){
  var out=[],v=Math.floor((j.start-0.01)/5)*5;
  while(v>j.goal){out.push(v);v-=5}
  out.push(j.goal);
  return out;
}
function adherence(){
  var start=S.profile.startDate,end=todayKey(),sched=0,done=0;
  var n=clamp(daysBetween(start,end),0,400);
  for(var i=0;i<=n;i++){
    var k=addDays(start,i);
    if(isSessionDay(k)){sched++;if(S.logs[k]&&S.logs[k].done)done++}
  }
  return {sched:sched,done:done,pct:sched?done/sched:0};
}

/* ============================ schedule checks ============================ */
function sleepHours(){
  var p=S.profile;
  return ((((toMin(p.wake)-toMin(p.sleep))%1440)+1440)%1440)/60;
}
function scheduleChecks(){
  var p=S.profile,out=[];
  var blocks=(p.blocks||[]).slice().sort(function(a,b){return a.t-b.t});
  var sh=sleepHours(),tgt=p.sleepTarget||7.5;
  if(sh+0.25<tgt)out.push({level:"bad",title:"The night is too short",
    detail:"Lights out at "+fmtTime(toMin(p.sleep))+" and up at "+fmtTime(toMin(p.wake))+" leaves "+sh.toFixed(1)+" hours in bed, against a target of "+tgt+". Short sleep raises hunger and kills training quality. Move lights out earlier by "+Math.round((tgt-sh)*60)+" minutes."});
  else out.push({level:"ok",title:"Sleep window works",detail:sh.toFixed(1)+" hours between lights out and waking, which clears your "+tgt+" hour target."});

  var laps=[];
  for(var i=0;i<blocks.length-1;i++){
    var a=blocks[i],b=blocks[i+1];
    if(a.len&&a.t+a.len>b.t)laps.push(a.label+" runs into "+b.label);
  }
  if(laps.length)out.push({level:"bad",title:(laps.length===1?"Two blocks overlap":laps.length+" blocks overlap"),
    detail:laps.join(". ")+". Shorten the earlier one or push the later one back."});

  var wk=toMin(p.wake),sl=toMin(p.sleep),slAdj=sl<240?sl+1440:sl;
  var odd=blocks.filter(function(b){var t=b.t<wk-120?b.t+1440:b.t;return t<wk||t>slAdj});
  if(odd.length)out.push({level:"warn",title:"Something sits outside your waking hours",
    detail:odd.map(function(b){return b.label+" at "+fmtTime(b.t)}).join(", ")+". Either move it, or your real wake and sleep times are not what Setup says."});

  var w=workoutFor(todayKey());
  var health=blocks.filter(function(b){return b.kind==="health"});
  var train=health.filter(function(b){return (b.len||0)>=20});
  if(!train.length)out.push({level:"bad",title:"No block long enough to train in",
    detail:"Today's session needs about "+(w.minutes||25)+" minutes. Add a health block of at least that long, or the workout competes with whatever else is at that hour."});
  else if(w.minutes&&train[0].len<w.minutes-5)out.push({level:"warn",title:"The workout block is tight",
    detail:train[0].label+" is "+train[0].len+" minutes but today's session runs about "+w.minutes+". Stretch it or you will be cutting sets short."});

  var cap=studyHoursPerWeek(),load=loadNext7();
  if(cap<=0)out.push({level:"warn",title:"No study time blocked out",
    detail:"Nothing is marked study or project, so the week load meter cannot tell you anything. Add your real work hours."});
  else if(load>cap)out.push({level:"bad",title:"More work due than hours booked",
    detail:load.toFixed(1)+" hours of work is due in the next seven days and you have blocked "+cap.toFixed(1)+". Start something early, cut an estimate, or add "+Math.ceil(load-cap)+" hours."});

  var meals=blocks.filter(function(b){return b.kind==="meal"}).sort(function(a,b){return a.t-b.t});
  if(meals.length<3)out.push({level:"warn",title:"Fewer than three meals planned",
    detail:"Skipping mess meals almost always ends in a late-night snack run. Block all three, even short ones."});
  else{
    var gaps=[];
    for(var m=0;m<meals.length-1;m++)if(meals[m+1].t-meals[m].t>390)gaps.push(meals[m].label+" to "+meals[m+1].label);
    if(gaps.length)out.push({level:"warn",title:"A long gap between meals",
      detail:gaps.join(", ")+" is over six and a half hours. That is the gap that makes you overeat at the next meal."});
  }

  var wind=blocks.filter(function(b){var t=b.t<240?b.t+1440:b.t;return b.kind==="rest"&&t<slAdj&&t>=slAdj-120&&(b.len||0)>=20});
  if(!wind.length)out.push({level:"warn",title:"Nothing between work and sleep",
    detail:"Going from a screen straight to bed is why people lie awake. Add a 30 to 45 minute wind-down block before lights out."});

  if(p.smokeOn){
    var ss=smokeStats(),lim=smokeLimit(todayKey());
    if(ss.avg7!=null&&ss.avg7>lim+0.5)out.push({level:"warn",title:"Running above the smoking limit",
      detail:"You are averaging "+ss.avg7.toFixed(1)+" a day against a limit of "+lim+". Holding at this number for an extra week is better than pushing on and giving up. Change the pace in Setup rather than ignoring it."});
    if(p.ritualOn&&p.ritualTime){
      var rt2=toMin(p.ritualTime),clash=null;
      blocks.forEach(function(b){if(b.len&&rt2>=b.t&&rt2<b.t+b.len)clash=b});
      if(clash)out.push({level:"warn",title:"The "+(p.ritualName||"thadi")+" run lands inside "+clash.label,
        detail:clash.label+" runs "+fmtTime(clash.t)+" to "+fmtTime(clash.t+clash.len)+", and you go out at "+fmtTime(rt2)+
        ". One of the two is not really happening. Move the block earlier, or shorten it and put the run in the plan where it belongs."});
      else if(!blocks.some(function(b){return Math.abs(b.t-rt2)<=45}))out.push({level:"warn",
        title:"The "+(p.ritualName||"thadi")+" run is not in your day",
        detail:"You go out at "+fmtTime(rt2)+" but nothing is blocked there. An hour that reliably disappears should be on the plan, not a surprise."});
    }
    var hi=0,hidx=0;
    ss.hours.forEach(function(v,i){if(v>hi){hi=v;hidx=i}});
    if(hi>=3){
      var hStart=hidx*120,near=null;
      blocks.forEach(function(b){if(hStart>=b.t-60&&hStart<=b.t+(b.len||0))near=b.label});
      out.push({level:"warn",title:"Most of them land around "+fmtTime(hStart),
        detail:(near?"That is "+near+". ":"")+"Put something physical in that slot, even five minutes of it. The hour is the trigger, not the craving."});
    }
  }

  var busy=blocks.reduce(function(s,b){return s+(b.len||0)},0)/60;
  var awake=24-sh;
  if(busy>awake-1)out.push({level:"bad",title:"The day is overbooked",
    detail:"Your blocks add up to "+busy.toFixed(1)+" hours inside "+awake.toFixed(1)+" waking hours. Something will get dropped every day, and it is usually the workout."});

  return out;
}

/* ============================ diet ============================ */
function dietTargets(){
  var p=S.profile,w=latestWeight()||p.startWeight;
  if(!w)return null;
  var bmr;
  if(p.sex&&p.age&&p.heightCm)bmr=10*w+6.25*p.heightCm-5*p.age+(p.sex==="m"?5:-161);
  else bmr=w*22;
  var act={low:1.3,med:1.45,high:1.6}[p.activity||"low"];
  var tdee=bmr*act;
  var target=Math.round(tdee*0.78/10)*10;
  var floor=Math.round(Math.max(1500,bmr)/10)*10;
  if(target<floor)target=floor;
  var goalW=p.goalWeight||w;
  var protein=Math.round(clamp(goalW,40,200)*1.8);
  var fat=Math.round(w*0.7);
  var carbs=Math.max(60,Math.round((target-protein*4-fat*9)/4));
  var deficit=Math.round(tdee-target);
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),target:target,protein:protein,fat:fat,carbs:carbs,
    deficit:deficit,perWeek:(deficit*7/7700)};
}

var PACE={gentle:{d:7,n:"Gentle",sub:"one fewer a week"},standard:{d:5,n:"Steady",sub:"one fewer every 5 days"},fast:{d:3,n:"Fast",sub:"one fewer every 3 days"}};
var CRAVINGS=[
 "Drink a full glass of water, slowly, before you decide.",
 "Twenty bodyweight squats. By the time you finish, the peak has passed.",
 "Box breathing: in for 4, hold 4, out 4, hold 4. Six rounds.",
 "Walk to the end of the corridor and back, phone left behind.",
 "Brush your teeth. Almost nobody wants a cigarette straight after.",
 "Set a 5 minute timer and do literally anything else. Decide again when it rings.",
 "Wash your face with cold water and step outside for air instead.",
 "Message someone. The craving will be gone before they reply."
];
function paceDays(){return (PACE[S.profile.smokePace]||PACE.gentle).d}
function taperBase(k){
  var p=S.profile;
  var d=daysBetween(p.smokeStart||todayKey(),k);
  if(d<0)return p.smokeBase;
  return Math.max(0,p.smokeBase-Math.floor(d/paceDays()));
}
function isRitualDay(k){
  var p=S.profile;
  return !!(p.ritualOn&&p.ritualDays&&p.ritualDays.length&&p.ritualDays.indexOf(parseKey(k).getDay())>=0);
}
/* the week is the budget, not the day: a ritual night borrows from the days around it
   instead of being counted as a failure */
function smokeAlloc(k){
  var p=S.profile,base=taperBase(k);
  var n=(p.ritualOn&&p.ritualDays)?p.ritualDays.length:0;
  if(!n||n>=7||base===0)return {ritual:base,other:base,n:n,capped:false,flat:true};
  /* the quiet days can give some up, but never so much that they become the hard part */
  var weekly=base*7,floorOther=Math.max(0,Math.round(base*0.6));
  var maxRitual=Math.floor((weekly-floorOther*(7-n))/n);
  var want=base+(p.ritualExtra||0);
  var ritual=Math.max(base,Math.min(want,maxRitual));
  var other=Math.max(0,Math.floor((weekly-ritual*n)/(7-n)));
  return {ritual:ritual,other:other,n:n,capped:ritual<want,flat:false};
}
function smokeLimit(k){
  var p=S.profile;
  if(!p.smokeOn)return null;
  var a=smokeAlloc(k);
  if(a.flat)return a.ritual;
  return isRitualDay(k)?a.ritual:a.other;
}
function weeklyBudget(k){

    var d=addDays(ws,i);
    allowed+=smokeLimit(d);
    if(d<=todayKey())used+=cigsOn(d);
  }
  return {used:used,allowed:allowed,base:base};
}
function quitDateKey(){
  var p=S.profile;

}
function taperWeek(){
  var p=S.profile,d=Math.max(0,daysBetween(p.smokeStart||todayKey(),todayKey()));

function spread(n,first,last){
  var out=[];
  if(n<=0)return out;
  if(last<=first)last=first+60;
  if(n===1){out.push(Math.round((first+last)/2));return out}
  for(var i=0;i<n;i++)out.push(Math.round(first+(last-first)*i/(n-1)));
  return out;
}
function ritualBonus(){return Math.max(1,(S.profile.ritualExtra||0)+1)}
function smokeSlots(k){
  var p=S.profile,lim=smokeLimit(k);
  if(!lim)return [];
  var wake=toMin(p.wake),sleep=toMin(p.sleep); if(sleep<240)sleep+=1440;
  var first=wake+60,last=sleep-120;
  if(isRitualDay(k)&&p.ritualTime){
    /* park a cluster of them at the thadi, where they are actually going to happen */
    var rt=toMin(p.ritualTime),bonus=Math.min(lim,ritualBonus());
    var out=spread(lim-bonus,first,Math.max(first+30,rt-45));
