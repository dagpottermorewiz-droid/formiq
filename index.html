/* ---- steps ----
   The web has no pedometer, and Health Connect is native-only, so a walk is measured
   two ways at once and the better one wins when you stop:
     GPS    - distance between fixes, divided by your stride. Good outdoors, and it
              gives real distance and pace rather than a guess.
     motion - accelerometer peak counting. Works indoors and on a treadmill, where GPS
              is useless, but it is noisier.
   Neither runs with the app closed. Nothing on the web does. */
var WALK={on:false,count:0,smooth:0,lastPeak:0,armed:true,
          watchId:null,meters:0,last:null,fixes:0,acc:null,started:0,wake:null,timer:null};

/* The Android shell in android/ injects window.FormiqSteps, backed by the hardware
   step counter. When it is there it is the truth for the day's total, because it was
   counting while this page did not exist. In a plain browser it is simply absent. */
function nativeSteps(){
  var b=window.FormiqSteps;
  if(!b||typeof b.stepsToday!=="function")return null;
  try{ if(typeof b.available==="function"&&!b.available())return null }catch(e){return null}
  return b;
}
function nativeGranted(){
  var b=nativeSteps(); if(!b)return false;
  try{ return typeof b.granted!=="function"||!!b.granted() }catch(e){return false}
}
function syncNativeSteps(){
  var b=nativeSteps(); if(!b||!nativeGranted())return false;
  try{
    var n=b.stepsToday();
    if(typeof n!=="number"||!(n>=0))return false;
    var k=todayKey(),l=logFor(k);
    if(l.steps!==n){l.steps=n;saveLog(k);lsSave()}
    return true;
  }catch(e){return false}
}

function strideM(){
  /* Walking stride is about 0.414 x height; good enough, and tunable by height alone. */
  var h=+(S.profile.heightCm||0);
  return (h>120&&h<230?h:170)*0.414/100;
}
function haversine(a,b){
  var R=6371000, t=Math.PI/180;
  var dLat=(b.lat-a.lat)*t, dLon=(b.lon-a.lon)*t;
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+
        Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function walkGpsSteps(){return Math.round(WALK.meters/strideM())}
/* GPS wins once it has a real track; indoors it never gets there and motion carries it. */
function walkUsesGps(){return WALK.fixes>=5&&WALK.meters>=25}
function walkSteps(){return walkUsesGps()?walkGpsSteps():WALK.count}
function walkMins(){return Math.max(0,(Date.now()-WALK.started)/60000)}
function fmtDist(m){return m>=1000?(m/1000).toFixed(2)+" km":Math.round(m)+" m"}

function stepGoal(){var g=+(S.profile.stepGoal||0);return g>0?g:8000}
function addSteps(n){
  var k=todayKey(),l=logFor(k);
  l.steps=Math.max(0,Math.round((l.steps||0)+n));
  saveLog(k); lsSave();
}
function setSteps(n){
  var k=todayKey(),l=logFor(k);
  l.steps=Math.max(0,Math.round(n||0));
  saveLog(k); lsSave();
}
function stepCard(k,l){
  var have=Math.round(l.steps||0), goal=stepGoal(), pct=Math.min(100,Math.round(have/goal*100));
  var nat=nativeSteps(), natOn=!!nat&&nativeGranted();
  return '<section class="card"><div class="ch"><h2>Steps</h2><span class="hint">'+pct+'% of '+goal.toLocaleString()+'</span></div>'+
    '<div class="bigstat">'+have.toLocaleString()+'</div>'+
    '<div class="jbar" style="margin:8px 0 12px"><i style="width:'+pct+'%"></i></div>'+
    (natOn?'<p class="sub" style="margin:-2px 0 12px">Counted by your phone all day, walking with Formiq shut included.</p>'
      :nat?'<p class="sub" style="margin:-2px 0 10px">Your phone can count these all day. '+
        '<button class="btn sm" data-act="natask" style="margin-top:8px">Allow step counting</button></p>':"")+
    (WALK.on
      ? '<div class="walkgrid">'+
          '<div><div class="wl">steps</div><div class="wv" id="walkcount">'+walkSteps()+'</div></div>'+
          '<div><div class="wl">distance</div><div class="wv" id="walkdist">'+fmtDist(WALK.meters)+'</div></div>'+
          '<div><div class="wl">time</div><div class="wv" id="walktime">0s</div></div>'+
          '<div><div class="wl">pace</div><div class="wv" id="walkpace">&mdash;</div></div>'+
        '</div>'+
        '<div class="row" style="gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px">'+
          '<span class="pill on">source: <b id="walksrc">motion</b></span>'+
          '<button class="btn sm primary" data-act="walkstop">Stop and add</button>'+
          '<button class="btn sm ghost" data-act="walkcancel">Discard</button></div>'+
        '<p class="sub" style="margin:10px 0 0">Outdoors it measures real distance by GPS and divides by your stride. Indoors it falls back to counting motion. Keep the screen on &#8212; a browser stops counting the moment it is closed.</p>'
      : (l.walkM>0?'<p class="sub" style="margin:-2px 0 10px">'+fmtDist(l.walkM)+' walked today with the app open.</p>':"")+
        '<div class="row" style="gap:8px;flex-wrap:wrap">'+
          '<button class="btn sm" data-act="walkstart">Track a walk</button>'+
          (natOn?"":'<button class="btn sm ghost" data-act="step+" data-n="500">+500</button>'+
            '<button class="btn sm ghost" data-act="step+" data-n="1000">+1000</button>')+
        '</div>'+
        (natOn?"":'<label class="fl" style="margin-top:12px"><span>Or type what your phone says</span>'+
          '<input id="in-steps" type="number" min="0" max="100000" step="100" inputmode="numeric" value="'+(have||"")+'" placeholder="0" data-act="steps"></label>'))+
    '</section>';
}
function walkStart(){
  WALK.on=true; WALK.count=0; WALK.smooth=0; WALK.lastPeak=0; WALK.armed=true;
  WALK.meters=0; WALK.last=null; WALK.fixes=0; WALK.acc=null; WALK.started=Date.now();
  render();

  /* motion: free, instant, and the only thing that works indoors */
  function motionOn(){window.addEventListener("devicemotion",walkTick)}
  if(typeof DeviceMotionEvent!=="undefined"){
    if(typeof DeviceMotionEvent.requestPermission==="function"){
      DeviceMotionEvent.requestPermission().then(function(r){if(r==="granted")motionOn()}).catch(function(){});
    } else motionOn();
  }

  /* GPS: the accurate one outdoors. A refusal is not fatal, motion still counts. */
  if(navigator.geolocation){
    WALK.watchId=navigator.geolocation.watchPosition(walkFix,function(err){
      if(err&&err.code===1)toast("Location refused — counting by motion instead");
    },{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
  }

  /* Android will sleep the screen and freeze the page mid-walk otherwise. */
  if(navigator.wakeLock&&navigator.wakeLock.request){
    navigator.wakeLock.request("screen").then(function(s){WALK.wake=s}).catch(function(){});
  }
  WALK.timer=setInterval(walkPaint,1000);
}
function walkFix(pos){
  var c=pos.coords;
  WALK.acc=c.accuracy;
  /* A bad fix moves you 40m sideways while you stand still; drop those outright. */
  if(c.accuracy>35)return;
  var now={lat:c.latitude,lon:c.longitude,t:pos.timestamp||Date.now()};
  if(WALK.last){
    var d=haversine(WALK.last,now), dt=Math.max(0.001,(now.t-WALK.last.t)/1000);
    /* under 1.5m is GPS jitter; over 4 m/s is not walking, it is a jump between fixes */
    if(d>=1.5&&d/dt<=4){WALK.meters+=d;WALK.fixes++;WALK.last=now}
    else if(d<1.5){WALK.last=now}
  } else WALK.last=now;
  walkPaint();
}
function walkPaint(){
  if(!WALK.on)return;
  var set=function(id,v){var el=document.getElementById(id);if(el)el.textContent=v};
  set("walkcount",walkSteps().toLocaleString());
  set("walkdist",fmtDist(WALK.meters));
  var mins=walkMins();
  set("walktime",(mins<1?Math.round(mins*60)+"s":mins.toFixed(0)+" min"));
  set("walksrc",walkUsesGps()?"gps":(WALK.acc?"motion · waiting for gps":"motion"));
  var pace=WALK.meters>50&&mins>0.5?(mins/(WALK.meters/1000)).toFixed(1)+" min/km":"—";
  set("walkpace",pace);
}
/* Peak counting on the acceleration magnitude: track a slow average, call a step when
   the signal rises well above it, and re-arm once it settles. Debounced to 280ms so
   one footfall cannot register twice. */
function walkTick(e){
  var a=e.accelerationIncludingGravity||e.acceleration; if(!a)return;
  var m=Math.sqrt((a.x||0)*(a.x||0)+(a.y||0)*(a.y||0)+(a.z||0)*(a.z||0));
  WALK.smooth=WALK.smooth?WALK.smooth*0.85+m*0.15:m;
  var dev=m-WALK.smooth, now=Date.now();
  if(WALK.armed&&dev>1.1&&now-WALK.lastPeak>280){
    WALK.armed=false; WALK.lastPeak=now; WALK.count++;
    var el=document.getElementById("walkcount"); if(el)el.textContent=WALK.count;
  } else if(dev<0.35){ WALK.armed=true; }
}
function walkStop(save){
  window.removeEventListener("devicemotion",walkTick);
  if(WALK.watchId!=null&&navigator.geolocation)navigator.geolocation.clearWatch(WALK.watchId);
  if(WALK.timer)clearInterval(WALK.timer);
  if(WALK.wake){try{WALK.wake.release()}catch(e){} WALK.wake=null}
  WALK.watchId=null; WALK.timer=null;

  var n=walkSteps(), m=WALK.meters, byGps=walkUsesGps();
  WALK.on=false;
  if(save&&n>0){
    addSteps(n);
    if(m>0){var k=todayKey(),l=logFor(k);l.walkM=Math.round((l.walkM||0)+m);saveLog(k);lsSave()}
    toast("Added "+n.toLocaleString()+" steps"+(byGps?" · "+fmtDist(m):" by motion"));
  } else if(save){toast("Nothing counted")}
  render();
}

  });
  out.push('<section class="card"><div class="ch"><h2>Plate habits</h2><span class="hint">last 7 days</span></div>'+
    hs.map(function(x){

        '<div class="hv">'+x.n+'/7</div></div>'}).join("")+

  if(p.mbOn){

    }
    out.push('<section class="card"><div class="ch"><h2>Daily count</h2>'+
      '<span class="hint">'+(ms.avg!=null?ms.avg.toFixed(1)+' a day':'nothing logged')+'</span></div>'+
      (mbars.some(function(b){return b.value>0})?svgBars(mbars,"count")
        :emptyBlock("Nothing logged yet","The counter is on the Today tab."))+
      '<div class="kv" style="margin-top:14px">'+
        '<div><b>'+ms.week+'</b><span>this week</span></div>'+

    var avg=function(a){return a.length?a.reduce(function(s,v){return s+v},0)/a.length:null};

      ((ak==null&&ap==null)?emptyBlock("Nothing logged yet","Calories and protein go in the daily log on the Today tab.")
       :'<div class="kv">'+

         (ap!=null?'<div><b>'+Math.round(ap)+'g</b><span>avg protein'+(dt2?" of "+dt2.protein:"")+'</span></div>':"")+
         '<div><b>'+kc.length+'/14</b><span>days logged</span></div>'+
       '</div>'+
       (dt2&&ap!=null&&ap<dt2.protein*0.8?'<p class="note" style="margin:12px 0 0">Protein is running under target. That is the number to fix first; the calories matter less than this does.</p>':""))+
      '</section>');
  }
  return out.join("");
}
function emptyBlock(t,s){return '<div class="empty"><div class="eyebrow">'+esc(t)+'</div><p>'+esc(s)+'</p></div>'}
function svgBars(data,unit,targetLine){
  var W=680,H=170,PL=38,PR=6,PT=12,PB=24;
  var max=niceCeil(Math.max.apply(null,data.map(function(d){return d.value}).concat(targetLine?[targetLine]:[0])));
  var iw=W-PL-PR,ih=H-PT-PB,bw=iw/data.length;
  var y=function(v){return PT+ih-(v/max)*ih};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="bar chart">';
  [0,max/2,max].forEach(function(v){
    s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line-soft)" stroke-width="1"/>'+
       '<text x="'+(PL-7)+'" y="'+(y(v)+4)+'" text-anchor="end" fill="var(--fg-faint)" font-size="10.5" font-family="IBM Plex Mono, monospace">'+(max%2?v.toFixed(1):v)+'</text>';
  });
  data.forEach(function(d,i){
    var h=Math.max(d.value>0?2:0,(d.value/max)*ih),x=PL+i*bw+bw*0.18,w=bw*0.64;
    s+='<rect x="'+x+'" y="'+(PT+ih-h)+'" width="'+w+'" height="'+h+'" rx="3" fill="var(--accent)" opacity="'+(i===data.length-1?1:0.62)+'"/>';
    s+='<text x="'+(x+w/2)+'" y="'+(H-7)+'" text-anchor="middle" fill="var(--fg-faint)" font-size="10" font-family="IBM Plex Mono, monospace">'+esc(d.label)+'</text>';
  });
  if(targetLine)s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y(targetLine)+'" y2="'+y(targetLine)+'" stroke="var(--ember)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  s+='<text x="'+(W-PR)+'" y="'+(PT-2)+'" text-anchor="end" fill="var(--fg-faint)" font-size="10" font-family="IBM Plex Mono, monospace">'+esc(unit)+'</text>';
  return s+'</svg>';
}
function svgLine(pts,goal){
  var W=680,H=180,PL=40,PR=10,PT=16,PB=26;
  /* scale to the weigh-ins themselves; a goal far below would flatten the line into nothing */
  var dv=pts.map(function(p){return p.v});
  var lo=Math.min.apply(null,dv),hi=Math.max.apply(null,dv);
  var pad=Math.max(0.6,(hi-lo)*0.22);
  lo-=pad; hi+=pad;
  if(goal&&goal<hi&&goal>lo-(hi-lo)*0.5)lo=Math.min(lo,goal-0.4);
  lo=Math.floor(lo*2)/2; hi=Math.ceil(hi*2)/2;
  if(hi-lo<1)hi=lo+1;
  var showGoal=!!(goal&&goal>=lo&&goal<=hi);
  var iw=W-PL-PR,ih=H-PT-PB;
  var t0=parseKey(pts[0].k).getTime(),t1=parseKey(pts[pts.length-1].k).getTime();
  var span=Math.max(1,t1-t0);
  var x=function(k){return PL+((parseKey(k).getTime()-t0)/span)*iw};
  var y=function(v){return PT+ih-((v-lo)/(hi-lo))*ih};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="weight trend">';
  [lo,(lo+hi)/2,hi].forEach(function(v){
    s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line-soft)"/>'+
       '<text x="'+(PL-7)+'" y="'+(y(v)+4)+'" text-anchor="end" fill="var(--fg-faint)" font-size="10.5" font-family="IBM Plex Mono, monospace">'+v.toFixed(1)+'</text>';
  });
  if(showGoal)s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y(goal)+'" y2="'+y(goal)+'" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/>'+
    '<text x="'+(W-PR)+'" y="'+(y(goal)-6)+'" text-anchor="end" fill="var(--accent)" font-size="10" font-family="IBM Plex Mono, monospace">goal</text>';
  var d=pts.map(function(p,i){return (i?"L":"M")+x(p.k).toFixed(1)+" "+y(p.v).toFixed(1)}).join(" ");
  s+='<path d="'+d+'" fill="none" stroke="var(--ember)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){
    var last=i===pts.length-1;
    s+='<circle cx="'+x(p.k)+'" cy="'+y(p.v)+'" r="'+(last?4.5:2.6)+'" fill="var(--ember)"/>';
  });
  var lastP=pts[pts.length-1];
  s+='<text x="'+Math.min(W-PR,x(lastP.k)+8)+'" y="'+(y(lastP.v)-9)+'" text-anchor="end" fill="var(--fg)" font-size="11.5" font-weight="600" font-family="IBM Plex Mono, monospace">'+lastP.v.toFixed(1)+' kg</text>';
  s+='<text x="'+PL+'" y="'+(H-7)+'" fill="var(--fg-faint)" font-size="10" font-family="IBM Plex Mono, monospace">'+esc(shortDate(pts[0].k))+'</text>';
  s+='<text x="'+(W-PR)+'" y="'+(H-7)+'" text-anchor="end" fill="var(--fg-faint)" font-size="10" font-family="IBM Plex Mono, monospace">'+esc(shortDate(lastP.k))+'</text>';
  return s+'</svg>';
}

            '<button class="btn sm primary" data-act="gdconnect">Connect Google account</button>'+
            '<button class="btn sm ghost" data-act="gdforget">Change client ID</button></div>')+

    '<hr class="div"><div class="row" style="gap:8px;flex-wrap:wrap">'+
      '<button class="btn sm ghost" data-act="wipe" style="color:var(--danger)">Erase everything</button></div>'+

}

/* ---- live bar ---- */
function renderLiveBar(){
  var el=document.getElementById("livebar");
  if(UI.rest){
    var left=Math.max(0,Math.ceil((UI.rest.until-Date.now())/1000));
    el.innerHTML='<div class="livebar resting"><div class="inner">'+
      '<div><div class="cl">rest</div><div class="clock">'+left+'s</div></div>'+
      '<button class="btn sm sp" data-act="restend">Skip</button></div></div>';
    return;
  }
  if(UI.live){
    var ms=Date.now()-UI.live.startedAt+(UI.live.carry||0);
    var mm=Math.floor(ms/60000),ss=Math.floor(ms/1000)%60;
    el.innerHTML='<div class="livebar"><div class="inner">'+
      '<div><div class="cl">session running</div><div class="clock">'+mm+":"+String(ss).padStart(2,"0")+'</div></div>'+
      '<button class="btn sm" data-act="stop">Pause</button>'+
      '<button class="btn primary sm" data-act="finish">Finish</button></div></div>';
    return;
  }
  el.innerHTML="";
}
var toastT=null;
function toast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg; el.hidden=false; el.className="toast";
  if(toastT)clearTimeout(toastT);
  toastT=setTimeout(function(){el.hidden=true},2200);
}
function beep(){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    var ac=new C(),o=ac.createOscillator(),g=ac.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.value=0.07;
    o.connect(g); g.connect(ac.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.45);
    o.stop(ac.currentTime+0.5);
    setTimeout(function(){try{ac.close()}catch(e){}},900);
  }catch(e){}
}

  }

    DB.doc("profile/main").set(S.profile).catch(function(){});

var GD_SCOPE="https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email";

function gdCfg(){try{return JSON.parse(localStorage.getItem("formiq.gdrive")||"{}")}catch(e){return {}}}
function gdSet(patch){var c=gdCfg();Object.keys(patch).forEach(function(k){c[k]=patch[k]});try{localStorage.setItem("formiq.gdrive",JSON.stringify(c))}catch(e){}}
function gdWhen(iso){
  try{var d=new Date(iso);
    return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})+" at "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  }catch(e){return "earlier"}
}
function backupPayload(){
  return {app:"Formiq",version:1,exportedAt:new Date().toISOString(),profile:S.profile,logs:S.logs,tasks:S.tasks};
}
/* Incoming wins on a clash, so restoring a newer phone backup onto an older laptop
   copy does the obvious thing instead of silently keeping the stale day. */
function applyBackup(obj){
  if(!obj||typeof obj!=="object"||!obj.profile){toast("That file is not a Formiq backup");return}
  var nL=0,nT=0;
  S.profile=obj.profile;
  if(obj.logs)Object.keys(obj.logs).forEach(function(k){S.logs[k]=obj.logs[k];nL++});
  if(obj.tasks)Object.keys(obj.tasks).forEach(function(k){S.tasks[k]=obj.tasks[k];nT++});
  lsSave();
  if(DB&&canWrite){
    saveProfile();
    Object.keys(S.logs).forEach(saveLog);
    Object.keys(S.tasks).forEach(saveTask);
  }
  render();
  toast("Restored "+nL+" day"+(nL===1?"":"s")+" and "+nT+" task"+(nT===1?"":"s"));
}
/* DOWNLOADS is a Claude-artifact capability and is absent on a normal web host,
   so fall back to a Blob link, which is what the GitHub Pages copy actually uses. */
function doExport(){
  var name="formiq-"+todayKey()+".json", data=JSON.stringify(backupPayload(),null,2);
  if(DOWNLOADS){
    DOWNLOADS.save({filename:name,data:data})
      .then(function(){toast("Saved")})
      .catch(function(){toast("Download was not allowed")});
    return;
  }
  try{
    var url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    var a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},1000);
    toast("Saved");
  }catch(e){toast("Download was not allowed")}
}
function doImportPick(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f)return;
    var fr=new FileReader();
    fr.onload=function(){try{applyBackup(JSON.parse(fr.result))}catch(e){toast("That file is not valid JSON")}};
    fr.onerror=function(){toast("Could not read that file")};
    fr.readAsText(f);
  };
  inp.click();
}
function gdLoadLib(){
  return new Promise(function(res,rej){
    if(window.google&&window.google.accounts&&window.google.accounts.oauth2)return res();
    var s=document.createElement("script");
    s.src="https://accounts.google.com/gsi/client"; s.async=true; s.defer=true;
    s.onload=function(){res()};
    s.onerror=function(){rej(new Error("Could not reach Google. Check your connection."))};
    document.head.appendChild(s);
  });
}
function gdConnect(){
  var cfg=gdCfg();
  if(!cfg.clientId){toast("Add your client ID first");return}
  gdLoadLib().then(function(){
    var tc=window.google.accounts.oauth2.initTokenClient({
      client_id:cfg.clientId,
      scope:GD_SCOPE,
      callback:function(resp){
        if(!resp||!resp.access_token){toast("Google did not return a token");return}
        GD.token=resp.access_token;
        fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:"Bearer "+GD.token}})
          .then(function(r){return r.ok?r.json():null})
          .then(function(j){GD.email=j&&j.email?j.email:null})
          .catch(function(){})
          .then(function(){render();toast("Google connected")});
      },
      error_callback:function(){toast("Google sign-in did not finish")}
    });
    tc.requestAccessToken();
  }).catch(function(e){toast(e.message)});
}
function gdFindFile(){
  var cfg=gdCfg();
  if(cfg.fileId)return Promise.resolve(cfg.fileId);
  var q=encodeURIComponent("name='"+GD_FILE+"' and trashed=false");
  return fetch("https://www.googleapis.com/drive/v3/files?q="+q+"&fields=files(id)&pageSize=1",
    {headers:{Authorization:"Bearer "+GD.token}})
    .then(function(r){return r.ok?r.json():{files:[]}})
    .then(function(j){return j.files&&j.files[0]?j.files[0].id:null})
    .catch(function(){return null});
}
function gdBackup(){
  if(!GD.token){toast("Connect Google first");return}
  GD.busy=true; render();
  var body=JSON.stringify(backupPayload(),null,2);
  gdFindFile().then(function(id){
    var meta={name:GD_FILE,mimeType:"application/json"};
    var b="formiq"+Date.now();
    var multipart="--"+b+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(meta)+
      "\r\n--"+b+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+b+"--";
    return fetch("https://www.googleapis.com/upload/drive/v3/files"+(id?"/"+id:"")+"?uploadType=multipart",{
      method:id?"PATCH":"POST",
      headers:{Authorization:"Bearer "+GD.token,"Content-Type":"multipart/related; boundary="+b},
      body:multipart
    });
  }).then(function(r){
    if(!r.ok)throw new Error(r.status===401?"Google session expired &#8212; connect again":"Drive refused the upload ("+r.status+")");
    return r.json();
  }).then(function(j){
    gdSet({fileId:j.id,lastBackup:new Date().toISOString()});
    GD.busy=false; render(); toast("Backed up to Drive");
  }).catch(function(e){GD.busy=false;render();toast(e.message||"Backup failed")});
}
function gdRestore(){
  if(!GD.token){toast("Connect Google first");return}
  GD.busy=true; render();
  gdFindFile().then(function(id){
    if(!id)throw new Error("No backup found in your Drive");
    return fetch("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media",{headers:{Authorization:"Bearer "+GD.token}});
  }).then(function(r){
    if(!r.ok)throw new Error(r.status===401?"Google session expired &#8212; connect again":"Could not read the backup");
    return r.json();
  }).then(function(j){GD.busy=false;applyBackup(j)})
  .catch(function(e){GD.busy=false;render();toast(e.message||"Restore failed")});
}

/* ===================== reminders =====================
   A page with no server cannot wake itself at 7am. Web push needs a backend to send
   from, Notification Triggers never shipped, and iOS has no local scheduling at all.
   So there are two honest mechanisms here, and the UI says which does what:
     - a calendar file, whose alarms the phone's own OS fires whether or not this is open
     - a browser notification, which can only fire while the app is actually running */
var REM_DOW=["SU","MO","TU","WE","TH","FR","SA"];
function remCfg(){try{return JSON.parse(localStorage.getItem("formiq.remind")||"{}")}catch(e){return {}}}
function remSet(patch){var c=remCfg();Object.keys(patch).forEach(function(k){c[k]=patch[k]});try{localStorage.setItem("formiq.remind",JSON.stringify(c))}catch(e){}}
function remTime(){return remCfg().time||"18:00"}

function icsEsc(s){return String(s).replace(/([,;\\])/g,"\\$1").replace(/\r?\n/g,"\\n")}
function icsPad(n){return String(n).padStart(2,"0")}
function icsUTC(d){return d.getUTCFullYear()+icsPad(d.getUTCMonth()+1)+icsPad(d.getUTCDate())+"T"+icsPad(d.getUTCHours())+icsPad(d.getUTCMinutes())+"00Z"}
/* Floating local time on purpose: 18:00 should stay 18:00 if he changes timezone. */
function icsLocal(d){return d.getFullYear()+icsPad(d.getMonth()+1)+icsPad(d.getDate())+"T"+icsPad(d.getHours())+icsPad(d.getMinutes())+"00"}

function buildICS(){
  var p=S.profile, pl=plansFor(p), arr=(pl[p.daysPerWeek]||pl[4]);
  var t=remTime().split(":"), hh=+t[0], mm=+t[1];
  var now=new Date(), stamp=icsUTC(now), seed=now.getTime();
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Formiq//Training//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Formiq training"];
  arr.forEach(function(key,i){
    if(key==="rest")return;
    var ty=TEMPLATES[key]; if(!ty)return;
    var base=new Date(now.getFullYear(),now.getMonth(),now.getDate(),hh,mm,0);
    base=new Date(base.getTime()+((i-base.getDay()+7)%7)*DAY);
    L.push("BEGIN:VEVENT",
      "UID:formiq-"+i+"-"+seed+"@formiq.app",
      "DTSTAMP:"+stamp,
      "DTSTART:"+icsLocal(base),
      "DTEND:"+icsLocal(new Date(base.getTime()+40*60000)),
      "RRULE:FREQ=WEEKLY;BYDAY="+REM_DOW[i],
      "SUMMARY:"+icsEsc("Formiq — "+ty.n),
      "DESCRIPTION:"+icsEsc(ty.sub||"Training session"),
      "BEGIN:VALARM","TRIGGER:-PT10M","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(ty.n),"END:VALARM",
      "END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function remExportICS(){
  var data=buildICS(), name="formiq-training.ics";
  if(/BEGIN:VEVENT/.test(data)===false){toast("No training days in this plan");return}
  if(DOWNLOADS){
    DOWNLOADS.save({filename:name,data:data}).then(function(){toast("Calendar file saved")})
      .catch(function(){toast("Download was not allowed")});
    return;
  }
  try{
    var url=URL.createObjectURL(new Blob([data],{type:"text/calendar"}));
    var a=document.createElement("a"); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},1000);
    toast("Calendar file saved");
  }catch(e){toast("Download was not allowed")}
}

function notifOK(){return typeof Notification!=="undefined"}
function remAskNotify(){
  if(!notifOK()){toast("This browser has no notifications");return}
  if(Notification.permission==="denied"){toast("Notifications are blocked in browser settings");return}
  Notification.requestPermission().then(function(perm){
    remSet({notify:perm==="granted"});
    render();
    toast(perm==="granted"?"Notifications on":"Notifications were not allowed");
  }).catch(function(){toast("Could not ask for permission")});
}
function remFire(title,body){
  if(!notifOK()||Notification.permission!=="granted")return;
  var opts={body:body,icon:"icon-192.png",badge:"icon-192.png",tag:"formiq-session",renotify:false};
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready
        .then(function(reg){return reg.showNotification(title,opts)})
        .catch(function(){new Notification(title,opts)});
    } else { new Notification(title,opts); }
  }catch(e){}
}
/* ---- in-app alarm ----
   Fires while the app is open: three rising tones so it carries across a room. */
function alarmRing(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    var ac=new AC();
    [0,0.45,0.9].forEach(function(t,i){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type="sine"; o.frequency.value=660+i*160;
      g.gain.setValueAtTime(0.0001,ac.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.32,ac.currentTime+t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+t+0.33);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime+t); o.stop(ac.currentTime+t+0.36);
    });
    setTimeout(function(){try{ac.close()}catch(e){}},2000);
  }catch(e){}
}

/* ---- web push ----
   The one mechanism that reaches a closed app. It needs the worker in backend/ to be
   deployed, because a push has to be sent from a server that holds the VAPID key. */
function pushCfg(){try{return JSON.parse(localStorage.getItem("formiq.push")||"{}")}catch(e){return {}}}
function pushSet(p){var c=pushCfg();Object.keys(p).forEach(function(k){c[k]=p[k]});try{localStorage.setItem("formiq.push",JSON.stringify(c))}catch(e){}}
function pushDays(){
  var p=S.profile, pl=plansFor(p), arr=(pl[p.daysPerWeek]||pl[4]), out=[];
  arr.forEach(function(k,i){if(k!=="rest")out.push(i)});
  return out;
}
function urlB64ToBytes(s){
  var pad="=".repeat((4-s.length%4)%4);
  var raw=atob((s+pad).replace(/-/g,"+").replace(/_/g,"/"));
  var out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}
function pushBase(){return String(pushCfg().url||"").replace(/\/+$/,"")}
function pushEnable(){
  var base=pushBase();
  if(!base){toast("Add your backend URL first");return}
  if(!("serviceWorker" in navigator)||!("PushManager" in window)){toast("This browser cannot do web push");return}
  if(!notifOK()){toast("This browser has no notifications");return}
  Notification.requestPermission().then(function(perm){
    if(perm!=="granted"){toast("Notifications were not allowed");return}
    return fetch(base+"/").then(function(r){return r.json()}).then(function(info){
      if(!info||!info.publicKey)throw new Error("Backend did not return a public key");
      return navigator.serviceWorker.ready.then(function(reg){
        return reg.pushManager.getSubscription().then(function(existing){
          return existing||reg.pushManager.subscribe({
            userVisibleOnly:true,
            applicationServerKey:urlB64ToBytes(info.publicKey)
          });
        });
      });
    }).then(function(sub){
      return fetch(base+"/subscribe",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          subscription:sub.toJSON(),
          time:remTime(),
          days:pushDays(),
          tz:new Date().getTimezoneOffset()
        })
      }).then(function(r){
        if(!r.ok)throw new Error("Backend refused the subscription ("+r.status+")");
        pushSet({on:true,endpoint:sub.endpoint});
        render(); toast("Push on. It will reach you with the app closed.");
      });
    });
  }).catch(function(e){toast(e.message||"Could not turn push on")});
}
function pushDisable(){
  var base=pushBase(), ep=pushCfg().endpoint;
  navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription()})
    .then(function(sub){return sub?sub.unsubscribe():null})
    .catch(function(){})
    .then(function(){
      if(base&&ep){
        return fetch(base+"/unsubscribe",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({endpoint:ep})}).catch(function(){});
      }
    })
    .then(function(){pushSet({on:false,endpoint:""});render();toast("Push off")});
}
function pushTest(){
  var base=pushBase(), ep=pushCfg().endpoint;
  if(!base||!ep){toast("Turn push on first");return}
  fetch(base+"/test",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({endpoint:ep})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
    .then(function(x){toast(x.ok&&x.j.ok?"Sent. Watch for it.":"Backend said: "+(x.j.error||x.j.status))})
    .catch(function(){toast("Could not reach the backend")});
}

/* Once a day at most, and only for a training day that is still unlogged. */
function remTick(){
  var c=remCfg();
  if(!c.notify||!notifOK()||Notification.permission!=="granted")return;
  var k=todayKey();
  if(c.lastNudge===k)return;
  var key=planKey(k,S.profile);
  if(key==="rest")return;
  var t=remTime().split(":");
  var now=new Date();
  if(now.getHours()*60+now.getMinutes() < (+t[0])*60+(+t[1]))return;
  var l=S.logs[k];
  if(l&&l.done)return;
  remSet({lastNudge:k});
  var ty=TEMPLATES[key], st=currentStreak();
  remFire("Today: "+(ty?ty.n:"your session"),
    st>0 ? "Not logged yet — a "+st+" day streak is on the line." : "Not logged yet. Good day to start the streak.");
  if(c.sound!==false)alarmRing();
}

/* ============================ boot ============================ */
(function(){
  var cached=lsLoad();
  if(cached&&cached.profile){S.profile=cached.profile;S.logs=cached.logs||{};S.tasks=cached.tasks||{}}
  else S.profile=defaultProfile();
  if(!S.profile.blocks||!S.profile.blocks.length)S.profile.blocks=defaultBlocks(S.profile.wake,S.profile.sleep);
  syncNativeSteps();
  render();
  remTick();
})();

function applyRemote(profile,logs,tasks){
  if(profile)S.profile=Object.assign(defaultProfile(),profile);
  if(!S.profile.blocks||!S.profile.blocks.length)S.profile.blocks=defaultBlocks(S.profile.wake,S.profile.sleep);
  if(logs)Object.keys(logs).forEach(function(k){S.logs[k]=logs[k]});
  if(tasks)Object.keys(tasks).forEach(function(k){S.tasks[k]=tasks[k]});
  lsSave();
  if(!document.querySelector("input:focus, select:focus, textarea:focus"))render();
}
function pull(){
  if(!DB)return Promise.resolve();
  lastSync=Date.now();
  return Promise.all([
    DB.doc("profile/main").get().catch(function(){return null}),
    DB.collection("logs").orderBy("date","desc").limit(400).get().catch(function(){return null}),
    DB.collection("tasks").limit(500).get().catch(function(){return null})
  ]).then(function(r){
    var prof=(r[0]&&r[0].exists)?r[0].data():null;
    var logs=null,tasks=null;
    if(r[1]){logs={};r[1].docs.forEach(function(d){var v=d.data();if(v)logs[d.id]=v})}
    if(r[2]){tasks={};r[2].docs.forEach(function(d){var v=d.data();if(v&&v.id)tasks[v.id]=v})}
    applyRemote(prof,logs,tasks);
    return !!prof;
  });
}
(function(){
  var c=window.claude;
  if(!c||typeof c.use!=="function")return;
  c.use("db").then(function(db){
    if(!db)return;
    DB=db;
    return pull().then(function(hadProfile){
      if(!hadProfile&&!pending["profile/main"])queue("profile/main",S.profile);
      render();
    });
  }).catch(function(){});
  c.use("user").then(function(u){
    if(!u||!u.can)return;
    return u.can("data.write").then(function(v){if(v===false){canWrite=false;render()}}).catch(function(){});
  }).catch(function(){});
  c.use("downloads").then(function(d){if(d){DOWNLOADS=d;if(UI.tab==="setup")render()}}).catch(function(){});
  c.use("sample").then(function(s){if(s){SAMPLE=s;render()}}).catch(function(){});
})();

document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"){flushAll();return}
  if(DB&&Date.now()-lastSync>45000)pull();
  else render();
});
window.addEventListener("pagehide",flushAll);
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)
  window.claude.hot.snapshot(function(){return {tab:UI.tab}});
if(window.claude&&window.claude.hot&&window.claude.hot.data&&window.claude.hot.data.tab){
  UI.tab=window.claude.hot.data.tab; render();
}
</script>
